name: Publish Paper 2.1 PDF (TeX container fallback)

on:
  push:
    branches:
      - paper/paper2.1-visit-frequency
    paths:
      - .github/workflows/publish-paper-pdf-container.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-paper2-1-texcontainer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out canonical Paper 2.1 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.14 for vector figures
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install plotting dependencies
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Build Holm figures from committed aggregate tables
        run: |
          python paper/paper_build.py --figures --no-auto
          ln -s ima-authoring-template/ima-authoring-template.cls paper/ima-authoring-template.cls

      - name: Compile clean and annotated manuscripts in TeX Live container
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            main_commented.tex
          working_directory: paper
          os: debian
          texlive_version: '2025'
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify compiled reader PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/main.pdf
          test -s paper/main_commented.pdf
          cp paper/main.pdf paper/paper.pdf
          python - <<'PY'
          from pathlib import Path
          f = Path("paper/paper.pdf")
          assert f.read_bytes().startswith(b"%PDF-")
          print("Compiled actual PDF, bytes:", f.stat().st_size)
          PY

      - name: Upload optional archival PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper2-1-container-${{ github.sha }}
          path: |
            paper/paper.pdf
            paper/main_commented.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Commit actual PDF binary to the paper branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- paper/paper.pdf
          python - <<'PY'
          import subprocess
          staged = subprocess.check_output(["git", "show", ":paper/paper.pdf"])
          assert staged.startswith(b"%PDF-"), "Staged object is not a PDF (possible LFS pointer)"
          PY
          if git diff --cached --quiet -- paper/paper.pdf; then
            echo 'Already up to date.'
          else
            git commit -m 'Publish compiled Paper 2.1 PDF for professor review'
            git push origin HEAD:paper/paper2.1-visit-frequency
          fi
