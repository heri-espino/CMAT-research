name: Paper 2.2.1 fused-frequency experiments

on:
  workflow_dispatch:
    inputs:
      effort:
        description: 'smoke: no bootstrap; standard: 30 cluster bootstraps; full: 100 + pooled 6+'
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - standard
          - full

permissions:
  contents: read

concurrency:
  group: paper221-fused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fused-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out Paper 2.2.1 code and frozen research design
        uses: actions/checkout@v4
        with:
          ref: paper/paper2.2.1-fused-frequency

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install research library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile new source
        run: |
          python -m py_compile \
            cmat_analysis/src/cmat_analysis/statistics/ordered_fusion.py \
            code/run_paper221_fused.py \
            code/figures_paper221.py

      - name: Unit tests on synthetic clustered data
        run: python -m pytest cmat_analysis/tests/test_ordered_fusion.py -q

      - name: Source-contract preflight
        run: |
          python code/run_paper221_fused.py --check
          python code/figures_paper221.py --check
          test -s data/controlled/Materias_pseudonymized.csv
          test -s data/controlled/Asesorias_pseudonymized.csv

      - name: Estimate regimes and export aggregate tables
        shell: bash
        env:
          EFFORT: ${{ inputs.effort }}
        run: |
          set -euo pipefail
          bootstrap=0
          pooled=()
          if [[ "$EFFORT" == standard ]]; then bootstrap=30; fi
          if [[ "$EFFORT" == full ]]; then bootstrap=100; pooled=(--include-pooled); fi
          python code/run_paper221_fused.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv \
            --seed 221 \
            --folds 4 \
            --cv-repeats 1 \
            --lambda-grid-size 12 \
            --validation-fraction 0.30 \
            --bootstrap "$bootstrap" \
            "${pooled[@]}"

      - name: Generate vector plots from aggregate results
        run: python code/figures_paper221.py

      - name: Compile stand-alone draft PDF
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          cd paper/paper221
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Verify export manifest and required files
        shell: bash
        run: |
          test -s results/paper221/run_manifest.json
          test -s results/paper221/tables/7plus_z_grade_primary_blocks.csv
          test -s results/paper221/tables/7plus_pass_blocks.csv
          test -s results/paper221/figures/7plus_pass_fused_levels.pdf
          test -s paper/paper221/main.pdf
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("results/paper221/run_manifest.json").read_text())
          assert len(data["results"]) >= 2
          for result in data["results"]:
              assert result["n_discovery"] > 0 and result["n_validation"] > 0
          print("Manifest and aggregate export contracts: OK")
          PY

      - name: Upload publication-safe aggregates, figures and paper draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper221-fused-${{ github.run_id }}-${{ inputs.effort }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            results/paper221/tables/*.csv
            results/paper221/figures/*.pdf
            results/paper221/run_manifest.json
            paper/paper221/main.pdf
