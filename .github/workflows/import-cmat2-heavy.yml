name: Import heavy CMAT2 snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-cmat2-heavy.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Clone historical CMAT2 repository
        run: |
          git clone --depth 1 https://github.com/heri-espino/CMAT2.git /tmp/CMAT2

      - name: Import full heavy bibliography
        run: |
          mkdir -p literature
          rm -rf literature/Bib
          rsync -a --delete /tmp/CMAT2/Bib/ literature/Bib/

      - name: Import v8 scientific snapshot without administrative data
        run: |
          mkdir -p code
          rsync -a --delete \
            --exclude 'data/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.DS_Store' \
            /tmp/CMAT2/CMAT_publication_draft_updated_v8/python/CMAT_publication_study/ \
            code/

      - name: Import v8 LaTeX report snapshot
        run: |
          mkdir -p reports/technical_report_v8
          rsync -a --delete \
            --exclude '.DS_Store' \
            /tmp/CMAT2/CMAT_publication_draft_updated_v8/latex/CMAT_latex_report_v1/ \
            reports/technical_report_v8/

      - name: Remove any accidental raw-data files
        run: |
          find code -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.parquet' -o -iname '*.feather' -o -iname '*.sav' -o -iname '*.dta' -o -iname '*.sas7bdat' \) -print -delete
          rm -rf code/data/raw code/data/private code/data/internal

      - name: Verify imported bibliography structure
        run: |
          test -d literature/Bib/assets
          test -d literature/Bib/extracted
          test -d literature/Bib/pdf
          test -d literature/Bib/references
          echo "PDFs: $(find literature/Bib/pdf -type f -name '*.pdf' | wc -l)"
          echo "Markdown: $(find literature/Bib/extracted -type f -name '*.md' | wc -l)"
          echo "Assets: $(find literature/Bib/assets -type f | wc -l)"

      - name: Commit imported snapshot
        run: |
          git config user.name 'CMAT research migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f literature/Bib code reports/technical_report_v8 .gitattributes docs/HEAVY_SNAPSHOT.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'migration: import heavy bibliography and v8 research snapshot'
          git push origin HEAD:main
