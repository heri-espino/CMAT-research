name: Paper 2.1 support audit CI

on:
  push:
    branches:
      - 'paper/paper2.1-visit-frequency'
    paths:
      - 'code/run_paper21.py'
      - 'code/run_paper21_outcomes.py'
      - 'code/run_paper21_mixture.py'
      - 'code/figures_paper21.py'
      - 'paper/**'
      - 'cmat_analysis/**'
      - 'data/controlled/**'
      - '.github/workflows/paper2-1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper21-support-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  support-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 2.1
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile Paper 2.1 runners and builders
        run: python -m py_compile code/run_paper21.py code/run_paper21_outcomes.py code/run_paper21_mixture.py code/figures_paper21.py paper/paper_build_figures.py paper/paper_build.py paper/build.py paper/docs/observations/build_observation_audit.py

      - name: Test reusable mixture estimators
        run: python -m pytest cmat_analysis/tests/test_mixtures.py -q

      - name: Check Paper 2.1 support-audit contract
        run: python code/run_paper21.py --check

      - name: Check Paper 2.1 dual-outcome contract
        run: python code/run_paper21_outcomes.py --check

      - name: Check Paper 2.1 mixture-analysis contract
        run: python code/run_paper21_mixture.py --check

      - name: Check Paper 2.1 observation-audit contract
        run: python paper/docs/observations/build_observation_audit.py --check

      - name: Run outcome-blind support audit
        run: |
          python code/run_paper21.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv \
            --candidate-top-exact 5

      - name: Run dual-outcome frequency analysis
        run: |
          python code/run_paper21_outcomes.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv

      - name: Run observed-failure and Gaussian-mixture analysis (one-time validation bootstrap)
        run: |
          python code/run_paper21_mixture.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv \
            --gmm-bootstrap 199 \
            --shape-bootstrap 199 \
            --shape-cv-folds 5 \
            --shape-cv-repeats 10

      - name: Verify support outputs
        shell: bash
        run: |
          for f in \
            results/paper21/tables/01_exact_positive_visit_support.csv \
            results/paper21/tables/02_candidate_tail_support.csv \
            results/paper21/tables/03_candidate_group_support.csv \
            results/paper21/tables/04_candidate_pair_overlap.csv \
