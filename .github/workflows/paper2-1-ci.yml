name: Paper 2.1 Holm analysis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper21-holm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  holm-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml
      - name: Install shared analysis package
        run: python -m pip install -e './cmat_analysis[dev]'
      - name: Check source contracts and syntax
        run: |
          python -m py_compile code/run_paper21.py code/run_paper21_outcomes.py code/figures_paper21.py paper/paper_build_figures.py paper/paper_build.py
          python code/run_paper21.py --check
          python code/run_paper21_outcomes.py --check
      - name: Produce attendance support, Wald and Holm tables
        run: python paper/paper_build.py --tables --figures
      - name: Verify primary adjusted outputs
        shell: bash
        run: |
          for f in \
            results/paper21/tables/10_benchmark_0_vs_1plus.csv \
            results/paper21/tables/12_primary_omnibus.csv \
            results/paper21/tables/13_primary_pairwise_continuous.csv \
            results/paper21/tables/14_primary_pairwise_pass.csv \
            results/paper21/tables/26a_zero_inclusive_7plus_pairwise_continuous.csv \
            results/paper21/tables/26k_zero_inclusive_7plus_pairwise_pass_lpm.csv \
            results/paper21/figures/fig03_04_pairwise_effect_dashboard.pdf \
            results/paper21/figures/fig05_pairwise_z_pvalue_dashboard.pdf \
            results/paper21/figures/fig06_pairwise_pass_pvalue_dashboard.pdf; do
            test -s "$f"
          done
      - name: Export vetted aggregate outputs as ephemeral artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper21-holm-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            results/paper21/tables/01_exact_positive_visit_support.csv
            results/paper21/tables/05_cut_overlap_frontier.csv
            results/paper21/tables/10_benchmark_0_vs_1plus.csv
            results/paper21/tables/11_primary_group_descriptives.csv
            results/paper21/tables/12_primary_omnibus.csv
            results/paper21/tables/13_primary_pairwise_continuous.csv
            results/paper21/tables/14_primary_pairwise_pass.csv
            results/paper21/tables/20_sensitivity_7plus_group_descriptives.csv
            results/paper21/tables/21_sensitivity_7plus_omnibus.csv
            results/paper21/tables/22_sensitivity_7plus_pairwise_continuous.csv
            results/paper21/tables/23_sensitivity_7plus_pairwise_pass.csv
            results/paper21/tables/26a_zero_inclusive_7plus_pairwise_continuous.csv
            results/paper21/tables/26k_zero_inclusive_7plus_pairwise_pass_lpm.csv
            results/paper21/tables/28_instructor_cluster_omnibus.csv
            results/paper21/figures/fig03_04_pairwise_effect_dashboard.pdf
            results/paper21/figures/fig05_pairwise_z_pvalue_dashboard.pdf
            results/paper21/figures/fig06_pairwise_pass_pvalue_dashboard.pdf
