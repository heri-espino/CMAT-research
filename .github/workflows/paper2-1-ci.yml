name: Paper 2.1 support audit CI

on:
  push:
    branches:
      - 'paper/paper2.1-visit-frequency'
    paths:
      - 'code/run_paper21.py'
      - 'code/run_paper21_outcomes.py'
      - 'code/run_paper21_mixture.py'
      - 'code/figures_paper21.py'
      - 'paper/**'
      - 'cmat_analysis/**'
      - 'data/controlled/**'
      - '.github/workflows/paper2-1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 2.1
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile Paper 2.1 runners
        run: python -m py_compile code/run_paper21.py code/run_paper21_outcomes.py code/run_paper21_mixture.py

      - name: Check Paper 2.1 support-audit contract
        run: python code/run_paper21.py --check

      - name: Check Paper 2.1 dual-outcome contract
        run: python code/run_paper21_outcomes.py --check

      - name: Check Paper 2.1 mixture-analysis contract
        run: python code/run_paper21_mixture.py --check

      - name: Run outcome-blind support audit
        run: |
          python code/run_paper21.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv \
            --candidate-top-exact 5

      - name: Run dual-outcome frequency analysis
        run: |
          python code/run_paper21_outcomes.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv

      - name: Run observed-failure and Gaussian-mixture analysis
        run: |
          python code/run_paper21_mixture.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv \
            --gmm-bootstrap 99

      - name: Verify support outputs
        shell: bash
        run: |
          for f in \
            results/paper21/tables/01_exact_positive_visit_support.csv \
            results/paper21/tables/02_candidate_tail_support.csv \
            results/paper21/tables/03_candidate_group_support.csv \
            results/paper21/tables/04_candidate_pair_overlap.csv \
            results/paper21/tables/05_cut_overlap_frontier.csv \
            results/paper21/tables/10_benchmark_0_vs_1plus.csv \
            results/paper21/tables/10b_zero_inclusive_descriptives.csv \
            results/paper21/tables/10c_zero_inclusive_outcome_state_composition.csv \
            results/paper21/tables/10d_zero_inclusive_exact_administrative_composition.csv \
            results/paper21/tables/10e_nonpass_management_benchmark_0_vs_1plus.csv \
            results/paper21/tables/10f_nonpass_management_descriptives_0_vs_1plus.csv \
            results/paper21/tables/10g_zero_inclusive_stacked_ridgeline_density.csv \
            results/paper21/tables/11_primary_group_descriptives.csv \
            results/paper21/tables/12_primary_omnibus.csv \
            results/paper21/tables/13_primary_pairwise_continuous.csv \
            results/paper21/tables/14_primary_pairwise_pass.csv \
            results/paper21/tables/15_primary_outcome_state_composition.csv \
            results/paper21/tables/15a_primary_exact_administrative_composition.csv \
            results/paper21/tables/15d_nonpass_management_omnibus.csv \
            results/paper21/tables/15e_nonpass_administrative_pairwise.csv \
            results/paper21/tables/15f_nonpass_BVRT_pairwise.csv \
            results/paper21/tables/15g_nonpass_BV_pairwise.csv \
            results/paper21/tables/15b_primary_distribution_profile.csv \
            results/paper21/tables/15c_primary_complete_case_distribution_profile.csv \
            results/paper21/tables/16_complete_case_pairwise_continuous.csv \
            results/paper21/tables/17_complete_case_omnibus.csv \
            results/paper21/tables/18_primary_z_heatmap_matrix.csv \
            results/paper21/tables/19_primary_pass_heatmap_matrix.csv \
            results/paper21/tables/20_sensitivity_7plus_group_descriptives.csv \
            results/paper21/tables/21_sensitivity_7plus_omnibus.csv \
            results/paper21/tables/22_sensitivity_7plus_pairwise_continuous.csv \
            results/paper21/tables/23_sensitivity_7plus_pairwise_pass.csv \
            results/paper21/tables/24_sensitivity_7plus_outcome_state_composition.csv \
            results/paper21/tables/24a_sensitivity_7plus_exact_administrative_composition.csv \
            results/paper21/tables/25_sensitivity_7plus_distribution_profile.csv \
            results/paper21/tables/26_instructor_cluster_pairwise_continuous.csv \
            results/paper21/tables/27_instructor_cluster_pairwise_pass.csv \
            results/paper21/tables/28_instructor_cluster_omnibus.csv \
            results/paper21/tables/29_instructor_cluster_benchmark_0_vs_1plus.csv \
            results/paper21/tables/30_numeric_failure_descriptives.csv \
            results/paper21/tables/31_numeric_failure_logit_pairwise_zero_inclusive.csv \
            results/paper21/tables/31a_numeric_failure_adjusted_probabilities_zero_inclusive.csv \
            results/paper21/tables/32_numeric_failure_logit_omnibus_zero_inclusive.csv \
            results/paper21/tables/33_numeric_failure_logit_model_info_zero_inclusive.csv \
            results/paper21/tables/34_numeric_failure_logit_pairwise_users.csv \
            results/paper21/tables/34a_numeric_failure_adjusted_probabilities_users.csv \
            results/paper21/tables/35_numeric_failure_logit_omnibus_users.csv \
            results/paper21/tables/36_numeric_failure_logit_model_info_users.csv \
            results/paper21/tables/37_complete_case_gmm_selection.csv \
            results/paper21/tables/38_complete_case_gmm_two_component_parameters.csv \
            results/paper21/tables/39_complete_case_gmm_bootstrap_1_vs_2.csv \
            results/paper21/tables/40_complete_case_gmm_soft_component_composition.csv \
            results/paper21/tables/41_imputed_gmm_selection.csv \
            results/paper21/tables/42_imputed_gmm_two_component_parameters.csv \
            results/paper21/tables/43_imputed_gmm_bootstrap_1_vs_2.csv \
            results/paper21/tables/44_imputed_gmm_soft_component_composition.csv \
            results/paper21/tables/45_gmm_component_comparison_complete_vs_imputed.csv \
            results/paper21/tables/46_complete_case_gmm_ridgeline_density.csv; do
            test -s "$f"
          done

      - name: Generate Paper 2.1 figures
        run: python code/figures_paper21.py

      - name: Verify GMM figures
        shell: bash
        run: |
          for f in \
            results/paper21/figures/fig04_complete_case_gmm_ridgeline.pdf \
            results/paper21/figures/fig05_lower_component_weight.pdf; do
            test -s "$f"
          done

      - name: Upload Paper 2.1 aggregate analysis
        uses: actions/upload-artifact@v4
        with:
          name: paper21-analysis-${{ github.sha }}
          path: |
            results/paper21/tables/*.csv
            results/paper21/figures/*.pdf
          if-no-files-found: error
          retention-days: 30
