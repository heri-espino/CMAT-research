name: Clean generated Sphinx build from legacy port

on:
  push:
    branches:
      - admin/port-legacy-save-figure-variants

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin/port-legacy-save-figure-variants
          fetch-depth: 0
          lfs: false
      - name: Remove generated documentation build and this workflow
        shell: bash
        run: |
          rm -rf cmat_analysis/docs/_build
          rm .github/workflows/cleanup-legacy-port-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cmat_analysis/docs/_build .github/workflows/cleanup-legacy-port-build.yml
          git commit -m "chore(docs): remove generated Sphinx build artifacts"
          git push origin HEAD:admin/port-legacy-save-figure-variants
