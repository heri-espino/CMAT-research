name: Apply latest methodology patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-methodology-v5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify patch checksum
        run: |
          base64 -d scripts/patches/methodology_v5.tar.gz.b64 > /tmp/methodology_v5.tar.gz
          echo '236eb57438eb88a0ddd126f3914f1d5fe9131deb69d53a50e51d2cc9f7f85211  /tmp/methodology_v5.tar.gz' | sha256sum -c -

      - name: Apply methodology patch over imported v8 snapshot
        run: |
          tar -xzf /tmp/methodology_v5.tar.gz -C code

      - name: Sanity-check privacy boundary
        run: |
          if find code -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.parquet' -o -iname '*.feather' -o -iname '*.sav' -o -iname '*.dta' -o -iname '*.sas7bdat' \) | grep -q .; then
            echo 'ERROR: raw-data file detected under code/' >&2
            exit 1
          fi
          test -f code/src/visitas_analysis/study/extended_methodology.py
          test -f code/PYTHON_FUNCTION_INDEX.md
          test -f code/METHODOLOGY_CHANGELOG.md

      - name: Run study helper tests
        run: |
          python -m pip install --quiet pytest numpy pandas scipy statsmodels matplotlib pingouin scikit-learn openpyxl
          PYTHONPATH=code/src:code python -m pytest -q code/tests/test_study_helpers.py

      - name: Commit latest methodology layer
        run: |
          git config user.name 'CMAT research migration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f code/config/study_config.py \
            code/src/visitas_analysis/study/outcomes.py \
            code/src/visitas_analysis/study/pipeline.py \
            code/src/visitas_analysis/study/plots.py \
            code/src/visitas_analysis/study/extended_methodology.py \
            code/src/visitas_analysis/study/extended_plots.py \
            code/tests/test_study_helpers.py \
            code/STUDY_PROTOCOL.md \
            code/PYTHON_FUNCTION_INDEX.md \
            code/METHODOLOGY_CHANGELOG.md \
            code/.ai_handoff.md \
            code/SOURCE_MANIFEST_SHA256.txt
          if git diff --cached --quiet; then
            echo 'No methodology changes to commit.'
            exit 0
          fi
          git commit -m 'methodology: apply latest KDE, pairwise, periodicity and progressor updates'
          git push origin HEAD:main
