name: Paper 1 recipe CI

on:
  push:
    branches:
      - 'paper/paper1-ppa-persistence'
    paths:
      - 'code/**'
      - 'paper/**'
      - 'literature_selected/**'
      - 'results/README.md'
      - 'PAPER_BRANCH.md'
      - 'cmat_analysis/**'
      - '.github/workflows/paper1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 1 with Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile Python entry points
        run: python -m py_compile code/run_paper.py paper/build.py literature_selected/notes_on_papers/_generate.py

      - name: Validate Paper 1 recipe without private data
        run: python code/run_paper.py --check

      - name: Validate annotated-literature generator
        run: python literature_selected/notes_on_papers/_generate.py --check

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern

      - name: Compile Paper 1 manuscript
        run: python paper/build.py
