name: Paper 1 recipe CI

on:
  push:
    branches:
      - 'paper/paper1-ppa-persistence'
    paths:
      - 'code/**'
      - 'paper/**'
      - 'literature_selected/**'
      - 'results/README.md'
      - 'PAPER_BRANCH.md'
      - 'cmat_analysis/**'
      - '.github/workflows/paper1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 1 with Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile Python entry points
        run: python -m py_compile code/run_paper.py code/context_analysis.py code/figures.py paper/build.py literature_selected/notes_on_papers/_generate.py

      - name: Validate Paper 1 recipe without controlled data
        run: python code/run_paper.py --check

      - name: Run controlled Paper 1 analysis
        run: python code/run_paper.py

      - name: Run classroom and degree-programme context analysis
        run: python code/context_analysis.py

      - name: Upload aggregate instructor familiarity and context results
        uses: actions/upload-artifact@v4
        with:
          name: paper1-instructor-familiarity-context-${{ github.sha }}
          path: |
            results/tables/120_mu_professor_visit_group_distribution_summary.csv
            results/tables/121_mu_professor_visit_group_multinomial_increment.csv
            results/tables/122_mu_professor_any_use_increment.csv
            results/tables/123_calc_professor_any_use_increment.csv
            results/tables/124_familiarization_with_calc_professor_models.csv
            results/tables/125_professor_familiarization_interaction_coefficients.csv
            results/tables/126_professor_familiarization_group_slopes.csv
            results/tables/127_professor_familiarization_diagnostics.csv
            results/tables/128_professor_propensity_by_prior_familiarity.csv
            results/tables/129_familiarization_with_calc_professor_models_all_subsequent.csv
            results/tables/130_professor_familiarization_group_slopes_all_subsequent.csv
            results/tables/131_professor_familiarization_diagnostics_all_subsequent.csv
            results/tables/132_professor_familiarization_interaction_coefficients_all_subsequent.csv
            results/tables/140_mu_major_visit_group_summary.csv
            results/tables/141_mu_major_any_use_increment.csv
            results/tables/142_mu_major_visit_group_multinomial_increment.csv
            results/tables/143_mu_classroom_outcome_context_summary.csv
            results/tables/144_mu_observed_classroom_context_uptake_models.csv
            results/tables/145_mu_historical_professor_academic_context_uptake_models.csv
            results/tables/146_mu_professor_uptake_vs_academic_context_correlations.csv
            results/run_summary.json
          retention-days: 30

      - name: Validate annotated-literature generator
        run: python literature_selected/notes_on_papers/_generate.py --check

      # Manuscript compilation and artifact upload are centralized in
      # .github/workflows/paper-build.yml, shared from main.
