name: Paper 1 recipe CI

on:
  push:
    branches:
      - 'paper/paper1-ppa-persistence'
    paths:
      - 'code/**'
      - 'paper/**'
      - 'results/README.md'
      - 'PAPER_BRANCH.md'
      - 'cmat_analysis/**'
      - '.github/workflows/paper1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'
      - name: Compile Python entry points
        run: python -m py_compile code/run_paper.py paper/build.py
      - name: Validate Paper 1 recipe without private data
        run: python code/run_paper.py --check
