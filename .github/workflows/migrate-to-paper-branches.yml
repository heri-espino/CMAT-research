name: Migrate to paper branches

on:
  push:
    paths:
      - '.github/workflows/migrate-to-paper-branches.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Migrate shared main layout
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$GITHUB_SHA"
          echo "$BASE_SHA" > /tmp/cmat_base_sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv code cmat_analysis
          git mv cmat_analysis/src/visitas_analysis cmat_analysis/src/cmat_analysis
          git mv cmat_analysis/.ai_handoff.md cmat_analysis/AI_HANDOFF.md

          mkdir -p cmat_analysis/src/cmat_analysis/config
          git mv cmat_analysis/config/__init__.py cmat_analysis/src/cmat_analysis/config/__init__.py
          git mv cmat_analysis/config/settings.py cmat_analysis/src/cmat_analysis/config/settings.py
          git mv cmat_analysis/config/study_config.py cmat_analysis/src/cmat_analysis/config/study_config.py
          rmdir cmat_analysis/config

          git mv reports brainstorm
          git mv analysis/shared brainstorm/shared
          git mv analysis/README.md brainstorm/SHARED_OUTPUTS.md
          rmdir analysis

          git rm -r papers
          git rm -f .github/workflows/compile-paper1.yml .github/workflows/generate-paper1-annotated-sources.yml

          python - <<'PY'
          from pathlib import Path

          SKIP_SUFFIXES = {'.pdf', '.png', '.jpg', '.jpeg', '.zip', '.xlsx', '.xls', '.pyc'}
          replacements = [
              ('visitas_analysis', 'cmat_analysis'),
              ('from config.', 'from cmat_analysis.config.'),
              ('import config.', 'import cmat_analysis.config.'),
              ('code/src/', 'cmat_analysis/src/'),
              ('code/FUNCTION_INDEX.md', 'cmat_analysis/FUNCTION_INDEX.md'),
              ('code/.ai_handoff.md', 'cmat_analysis/AI_HANDOFF.md'),
              ('code/pyproject.toml', 'cmat_analysis/pyproject.toml'),
              ('code/environment.yml', 'cmat_analysis/environment.yml'),
              ('code/requirements.txt', 'cmat_analysis/requirements.txt'),
              ('code/scripts/', 'cmat_analysis/scripts/'),
              ('code/tests/', 'cmat_analysis/tests/'),
              ('reports/', 'brainstorm/'),
              ('analysis/shared/', 'brainstorm/shared/'),
              ('papers/<paper_id>/', 'the corresponding paper branch'),
          ]
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in SKIP_SUFFIXES:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
          PY

          cat > cmat_analysis/pyproject.toml <<'EOF'
          [project]
          name = "cmat-analysis"
          version = "0.1.0"
          description = "Reusable scientific analysis library for the CMAT research programme."
          requires-python = ">=3.14,<3.15"
          dependencies = [
              "pandas==3.0.3",
              "numpy==2.4.6",
              "matplotlib==3.10.9",
              "seaborn==0.13.2",
              "scipy==1.17.1",
              "scikit-learn==1.8.0",
              "statsmodels==0.14.6",
              "openpyxl==3.1.5",
          ]

          [project.optional-dependencies]
          dev = ["build", "pytest"]

          [build-system]
          requires = ["setuptools>=68"]
          build-backend = "setuptools.build_meta"

          [tool.setuptools.packages.find]
          where = ["src"]
          include = ["cmat_analysis*"]

          [tool.pytest.ini_options]
          pythonpath = ["src"]
          testpaths = ["tests"]
          EOF

          cat > .gitattributes <<'EOF'
          # Heavy binary research assets use Git LFS. A local clone should run
          # `git lfs install` once and `git lfs pull` when assets are missing.
          literature/**/*.pdf filter=lfs diff=lfs merge=lfs -text
          literature/**/*.png filter=lfs diff=lfs merge=lfs -text
          literature/**/*.jpg filter=lfs diff=lfs merge=lfs -text
          literature/**/*.jpeg filter=lfs diff=lfs merge=lfs -text
          brainstorm/**/*.pdf filter=lfs diff=lfs merge=lfs -text
          brainstorm/**/*.png filter=lfs diff=lfs merge=lfs -text
          brainstorm/**/*.jpg filter=lfs diff=lfs merge=lfs -text
          paper/**/*.pdf filter=lfs diff=lfs merge=lfs -text
          paper/**/*.png filter=lfs diff=lfs merge=lfs -text
          literature_selected/**/*.pdf filter=lfs diff=lfs merge=lfs -text
          literature_selected/**/*.png filter=lfs diff=lfs merge=lfs -text
          **/*.zip filter=lfs diff=lfs merge=lfs -text
          EOF

          cat > README.md <<'EOF'
          # CMAT research

          This repository separates shared scientific infrastructure from publication-specific work by using `main` as the upstream research branch and one long-lived branch per paper.

          ## Main branch

          `main` contains only material shared across the research programme:

          ```text
          CMAT-research/
          ├── cmat_analysis/   # installable reusable scientific library
          ├── data/            # controlled-data contracts; no raw microdata in Git
          ├── literature/      # shared physical/source literature library
          ├── brainstorm/      # broad analyses, diagnostics, nulls, sensitivities, ideas
          └── docs/            # programme-wide documentation and provenance
          ```

          The central computational asset is `cmat_analysis`, installed locally with:

          ```bash
          python -m pip install -e ./cmat_analysis
          ```

          Code that defines *how a scientific quantity is calculated* belongs in `cmat_analysis/src/cmat_analysis/`. Brainstorm work imports that library rather than implementing parallel estimators.

          ## Paper branches

          The publication branches are:

          - `paper/paper1-ppa-persistence`
          - `paper/paper2-mu-performance`
          - `paper/paper3-grading-heterogeneity`
          - `paper/paper4-degree-help-seeking`
          - `paper/paper5-longitudinal-trajectories`

          Each inherits the shared `main` tree and adds paper-specific `literature_selected/`, `code/`, `results/`, `paper/`, and `submission/` workspaces. The branch-local `code/` is orchestration only: it may call `cmat_analysis`, choose specifications, and write paper results, but reusable scientific functions must return upstream to `main/cmat_analysis`.

          ## Production model

          ```text
          shared library + data contracts + literature
                          ↓
                      brainstorm
                          ↓
                   paper branch
               literature_selected
                          +
                     code/ runner
                          ↓
                       results
                          ↓
                        paper
          ```

          Read `AI_HANDOFF.md`, `docs/RESEARCH_WORKFLOW.md`, and the current branch's `PAPER_BRANCH.md` before substantive work.

          ## Git LFS

          PDFs and other heavy research binaries remain in Git LFS. Install once with `git lfs install`; after cloning or when a binary appears as a pointer, run `git lfs pull`.
          EOF

          cat > AI_HANDOFF.md <<'EOF'
          # CMAT AI handoff

          ## Architecture invariant

          `main` is the upstream scientific branch. It owns shared `cmat_analysis/`, `data/`, `literature/`, `brainstorm/`, and `docs/`. Publication-specific material belongs on one of the five `paper/*` branches, not on `main`.

          `cmat_analysis/` is an installable internal scientific library analogous to a project-specific scikit-learn. Use `python -m pip install -e ./cmat_analysis`. Search `cmat_analysis/FUNCTION_INDEX.md` before adding functions. Reusable cohort definitions, transformations, estimators, tests, models, confidence intervals, imputation logic and plotting functions belong only in `cmat_analysis/src/cmat_analysis/`.

          `brainstorm/` is the broad research-development layer. It preserves exploratory analyses, diagnostics, nulls, robustness checks, methodological reasoning and retained aggregate outputs. Brainstorm-local runners may orchestrate library calls but must not become independent scientific libraries.

          Each paper branch adds `literature_selected/`, branch-local `code/`, `results/`, `paper/`, and `submission/`. Branch-local `code/` answers *which shared functions/specifications are run for this paper*; `cmat_analysis` answers *how calculations work*.

          When paper work requires a new reusable capability, implement and validate it on `main` in `cmat_analysis`, then merge/rebase `main` into the paper branch. Do not leave reusable library changes isolated on a paper branch.

          The physical literature corpus remains shared under `literature/library/`; `literature_selected/` contains only the branch-specific selection, reading notes and annotated Markdown derivatives.

          Raw institutional microdata, identifiers, credentials and secrets must never be committed. Heavy PDFs/images remain in Git LFS.

          Read `docs/RESEARCH_WORKFLOW.md`, `cmat_analysis/AI_HANDOFF.md`, `brainstorm/AI_HANDOFF.md`, and `PAPER_BRANCH.md` when present.
          EOF

          cp AI_HANDOFF.md AGENTS.md

          cat > cmat_analysis/README.md <<'EOF'
          # cmat_analysis

          `cmat_analysis` is the reusable scientific Python library for CMAT research. It is shared by `main` and every paper branch.

          Install in editable mode from the repository root:

          ```bash
          python -m pip install -e ./cmat_analysis
          ```

          The import namespace is:

          ```python
          import cmat_analysis
          ```

          Source code lives in `src/cmat_analysis/`; tests live in `tests/`. Before writing a new function, search `FUNCTION_INDEX.md` and inspect the nearest existing implementation. Report/brainstorm and paper-specific runners should import this package rather than modify `sys.path` or copy scientific functions.
          EOF

          cat > cmat_analysis/AI_HANDOFF.md <<'EOF'
          # cmat_analysis AI handoff

          This directory is the shared scientific library and is upstream of all brainstorms and paper branches.

          Before implementing a reusable capability, search `FUNCTION_INDEX.md`. Extend an existing scientifically equivalent function when possible. New cohort logic, outcomes, estimators, tests, models, uncertainty calculations, imputation rules and reusable plots belong under `src/cmat_analysis/`, with tests and concise docstrings.

          The package must remain installable with `python -m pip install -e ./cmat_analysis`; consumers should use normal `cmat_analysis...` imports. Do not require consumers to inject repository paths into `sys.path`.

          Paper-specific specification choices and execution order do not belong here; they belong in the owning branch's root `code/`. Broad exploratory orchestration belongs in `brainstorm/<topic>/code/`.
          EOF

          cat > brainstorm/README.md <<'EOF'
          # Brainstorm

          `brainstorm/` is the shared research-development layer on `main`. It replaces the former `reports/` concept: these are not publication-final reports, but broad, reproducible workspaces where questions are explored and evidence is stress-tested before selection into a paper.

          A brainstorm may contain notes, a thin `code/` runner, tables, figures, provenance and a compiled research document. Its runner imports `cmat_analysis`; reusable scientific functions remain in `cmat_analysis/src/cmat_analysis/`.

          `shared/` preserves cross-topic historical aggregate outputs and provenance that should not be silently discarded.
          EOF

          cat > brainstorm/AI_HANDOFF.md <<'EOF'
          # Brainstorm AI handoff

          Use brainstorms to test questions broadly, preserve nulls and sensitivities, compare specifications and record methodological reasoning. A local runner may choose inputs/configuration and call `cmat_analysis`, but it must not implement a second copy of reusable scientific logic.

          Workflow: record the question -> search `cmat_analysis/FUNCTION_INDEX.md` -> add missing reusable capability to `cmat_analysis` with tests -> call it from the brainstorm -> inspect diagnostics/sensitivities -> only then select evidence into a paper branch.
          EOF

          cat > docs/RESEARCH_WORKFLOW.md <<'EOF'
          # CMAT research workflow

          ## Shared upstream

          `main` contains the common scientific substrate: `cmat_analysis/`, `data/`, `literature/`, `brainstorm/`, and `docs/`. It does not contain publication-specific manuscript trees.

          `cmat_analysis` is the internal reusable library. Install it editable with `python -m pip install -e ./cmat_analysis`. Any calculation that could be reused, audited or compared across papers belongs there.

          `brainstorm` is where broad research questions are tested. It keeps diagnostics, failed ideas, nulls, alternative definitions and sensitivity analyses so papers do not become the only scientific record.

          ## Publication branches

          Each paper has a long-lived branch. The branch inherits the current shared upstream and adds:

          ```text
          literature_selected/   paper-specific source selection and annotations
          code/                  thin paper-specific analysis orchestration
          results/               generated/selected paper outputs
          paper/                 manuscript and build files
          submission/            journal-specific material when needed
          PAPER_BRANCH.md         branch contract and paper identity
          ```

          `code/` on a paper branch may specify a cohort/configuration/model sequence by importing `cmat_analysis`; it may not become a second reusable library.

          ## Upstream rule

          If a paper exposes a missing reusable function, fix it in `main/cmat_analysis`, test it there, then bring `main` into the paper branch and rerun the paper recipe. Changes to shared data contracts, physical literature, brainstorm evidence or programme-wide documentation should likewise be made upstream on `main` whenever possible.

          ## Literature

          `literature/` is the shared corpus. `literature_selected/` exists only on paper branches and contains the subset and derived reading material relevant to that publication; source PDFs remain in the shared library rather than being duplicated.
          EOF

          cat > docs/GIT_WORKFLOW.md <<'EOF'
          # Git workflow

          `main` is the shared upstream research branch. Five long-lived publication branches isolate paper-specific work:

          - `paper/paper1-ppa-persistence`
          - `paper/paper2-mu-performance`
          - `paper/paper3-grading-heterogeneity`
          - `paper/paper4-degree-help-seeking`
          - `paper/paper5-longitudinal-trajectories`

          Shared library/data/literature/brainstorm changes should land on `main`, then be merged or rebased into active paper branches. Paper-specific `literature_selected/`, `code/`, `results/`, `paper/` and `submission/` changes remain on that paper's branch.

          Do not merge a paper branch wholesale back into `main`, because doing so would reintroduce publication-specific trees. Promote only genuinely shared changes upstream, preferably as focused commits or cherry-picks.
          EOF

          cat > docs/PUBLICATION_PORTFOLIO.md <<'EOF'
          # Publication portfolio

          The publication programme is represented by five long-lived branches sharing one upstream scientific base.

          | Paper | Branch | Primary focus |
          |---|---|---|
          | Paper 1 | `paper/paper1-ppa-persistence` | PPA-linked CMAT use and later help-seeking persistence |
          | Paper 2 | `paper/paper2-mu-performance` | MU support use and classroom-relative performance |
          | Paper 3 | `paper/paper3-grading-heterogeneity` | grading/classroom heterogeneity and standardisation |
          | Paper 4 | `paper/paper4-degree-help-seeking` | degree programme and formal help-seeking |
          | Paper 5 | `paper/paper5-longitudinal-trajectories` | longer-run support-use and academic trajectories |

          Shared computation belongs to `main/cmat_analysis`; broad evidence development belongs to `main/brainstorm`; each paper branch owns its selected literature, paper-specific recipe, results and manuscript.
          EOF

          cat > REPRODUCING.md <<'EOF'
          # Reproducing CMAT research

          ## Environment

          Use Python 3.14 and install the shared library from the repository root:

          ```bash
          python -m pip install -e './cmat_analysis[dev]'
          ```

          Verify the library with:

          ```bash
          cd cmat_analysis
          pytest -q
          python scripts/generate_function_index.py
          ```

          Heavy binary assets use Git LFS. Install once with `git lfs install`; use `git lfs pull` after cloning when PDFs/images are still pointer files.

          ## Brainstorm execution

          Brainstorm-local runners import the installed `cmat_analysis` package. For example:

          ```bash
          python brainstorm/methodology_report/code/methodology_report.py --check
          ```

          ## Paper execution

          Checkout the desired `paper/*` branch, install the same editable shared library, then follow `PAPER_BRANCH.md` and the branch-local `code/`/`paper/` READMEs. New reusable calculations must first be validated in `cmat_analysis` rather than implemented only inside the paper recipe.
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('brainstorm/methodology_report/code/methodology_report.py')
          p.write_text('''"""Thin entry point for the methodology brainstorm.\n\nScientific implementation lives in the installed cmat_analysis package.\n"""\nfrom pathlib import Path\n\nfrom cmat_analysis.reporting.methodology_build import methodology_report_cli\n\nREPORT_DIR = Path(__file__).resolve().parents[1]\nREPO_ROOT = Path(__file__).resolve().parents[3]\n\nif __name__ == "__main__":\n    raise SystemExit(methodology_report_cli(REPO_ROOT, REPORT_DIR))\n''', encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('cmat_analysis/scripts/generate_function_index.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('src/visitas_analysis/', 'src/cmat_analysis/')
          text = text.replace('Canonical search index for `code/`', 'Canonical search index for `cmat_analysis/`')
          p.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/migrate-to-paper-branches.yml

      - name: Validate shared library and brainstorm runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './cmat_analysis[dev]'
          python - <<'PY'
          import cmat_analysis
          from cmat_analysis.config.study_config import get_study_config
          print('cmat_analysis editable import OK')
          PY
          (cd cmat_analysis && pytest -q)
          python cmat_analysis/scripts/generate_function_index.py
          python brainstorm/methodology_report/code/methodology_report.py --check
          git diff --check

      - name: Commit shared main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'refactor: establish shared cmat_analysis and brainstorm main'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/cmat_main_sha

      - name: Create publication branches
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(cat /tmp/cmat_base_sha)"
          MAIN_SHA="$(cat /tmp/cmat_main_sha)"

          make_branch () {
            local branch="$1"
            local old="$2"
            local label="$3"

            git checkout -B "$branch" "$MAIN_SHA"
            git checkout "$BASE_SHA" -- "papers/$old"

            mkdir -p literature_selected code results paper submission

            if [ -d "papers/$old/literature" ]; then
              rm -rf literature_selected
              git mv "papers/$old/literature" literature_selected
            fi

            if [ -d "papers/$old/manuscript" ]; then
              rm -rf paper
              git mv "papers/$old/manuscript" paper
            fi

            if [ -f "papers/$old/README.md" ]; then
              git mv "papers/$old/README.md" paper/PROJECT_CONTEXT.md
            fi
            rm -rf "papers/$old" papers

            cat > PAPER_BRANCH.md <<EOF
          # $label branch

          This branch is the canonical publication workspace for $label. It inherits shared infrastructure from \`main\` and owns only publication-specific selection and production.

          Branch-local directories:
          - \`literature_selected/\`: selected literature, reading notes and annotated source Markdown;
          - \`code/\`: paper-specific orchestration that imports \`cmat_analysis\`;
          - \`results/\`: generated/selected outputs used by the paper;
          - \`paper/\`: manuscript/build material;
          - \`submission/\`: journal-specific material when needed.

          Reusable scientific logic must be implemented on \`main\` under \`cmat_analysis/src/cmat_analysis/\`, tested there, and then brought into this branch. Do not maintain a divergent private copy of shared functions here.
          EOF

            cat > code/README.md <<'EOF'
          # Paper-specific code

          This directory owns only the recipe for this publication: specification choices, execution order, paper-specific tables/figures and calls into the installed `cmat_analysis` library. Do not implement reusable estimators, cohorts, tests, transformations or plotting primitives here.

          Install the shared library with `python -m pip install -e ./cmat_analysis` before running paper code.
          EOF

            cat > results/README.md <<'EOF'
          # Paper results

          Generated or deliberately selected outputs used by this publication belong here. Preserve provenance back to the branch-local recipe and shared `cmat_analysis` functions; do not hand-edit numerical results.
          EOF

            if [ ! -f paper/README.md ]; then
              cat > paper/README.md <<'EOF'
          # Paper

          Publication manuscript and build assets belong here. `PROJECT_CONTEXT.md`, when present, preserves the pre-branch paper planning record.
          EOF
            fi

            cat > submission/README.md <<'EOF'
          # Submission

          Journal-specific cover letters, anonymised variants, checklists and submission exports belong here when they are created. Scientific results should remain sourced from `results/` and the validated branch recipe.
          EOF

            python - "$old" <<'PY'
          from pathlib import Path
          import sys
          old = sys.argv[1]
          skip = {'.pdf', '.png', '.jpg', '.jpeg', '.zip'}
          for root_name in ('literature_selected', 'paper'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() in skip:
                      continue
                  try:
                      text = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  new = text.replace('reports/', 'brainstorm/').replace('analysis/shared/', 'brainstorm/shared/')
                  new = new.replace(f'papers/{old}/literature/', 'literature_selected/')
                  new = new.replace(f'papers/{old}/manuscript/', 'paper/')
                  new = new.replace('../../literature/library/', '../literature/library/')
                  new = new.replace('../../../literature/library/', '../literature/library/')
                  if new != text:
                      p.write_text(new, encoding='utf-8')
          PY

            if [ "$old" = "paper1_ppa_persistence" ]; then
              python - <<'PY'
          from pathlib import Path
          main = Path('paper/main.tex')
          text = main.read_text(encoding='utf-8')
          text = text.replace('../../../reports/methodology_report/', '../brainstorm/methodology_report/')
          text = text.replace('../../../brainstorm/methodology_report/', '../brainstorm/methodology_report/')
          main.write_text(text, encoding='utf-8')

          build = Path('paper/build.py')
          if build.exists():
              text = build.read_text(encoding='utf-8')
              text = text.replace('REPO_ROOT = MANUSCRIPT_DIR.parents[2]', 'REPO_ROOT = MANUSCRIPT_DIR.parent')
              text = text.replace('/ "reports"', '/ "brainstorm"')
              build.write_text(text, encoding='utf-8')

          gen = Path('literature_selected/notes_on_papers/_generate.py')
          if gen.exists():
              text = gen.read_text(encoding='utf-8')
              text = text.replace('ROOT = Path(__file__).resolve().parents[4]', 'ROOT = Path(__file__).resolve().parents[2]')
              text = text.replace('ROOT / "papers" / "paper1_ppa_persistence" / "literature" / "reading_notes"', 'ROOT / "literature_selected" / "reading_notes"')
              gen.write_text(text, encoding='utf-8')
          PY

              cat > .github/workflows/compile-paper.yml <<'EOF'
          name: Compile Paper 1
          on:
            push:
              branches: ['paper/paper1-ppa-persistence']
              paths: ['paper/**', 'brainstorm/methodology_report/figures/refined_longitudinal_persistence_3241.png', '.github/workflows/compile-paper.yml']
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            compile:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    lfs: true
                - name: Install LaTeX
                  run: |
                    sudo apt-get update
                    sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
                - name: Compile
                  working-directory: paper
                  run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          EOF
            fi

            python - <<'PY'
          from pathlib import Path
          import re
          gen = Path('literature_selected/notes_on_papers/_generate.py')
          if gen.exists():
              # Ensure no stale nested-paper root remains after the layout migration.
              text = gen.read_text(encoding='utf-8')
              if 'papers/paper1_ppa_persistence' in text:
                  raise SystemExit('stale Paper 1 literature path remains')
          PY

            git add -A
            git commit -m "refactor: establish $label publication workspace"
            git push -u origin "$branch"
          }

          make_branch 'paper/paper1-ppa-persistence' 'paper1_ppa_persistence' 'Paper 1 — PPA persistence'
          make_branch 'paper/paper2-mu-performance' 'paper2_mu_performance' 'Paper 2 — MU performance'
          make_branch 'paper/paper3-grading-heterogeneity' 'paper3_grading_heterogeneity' 'Paper 3 — grading heterogeneity'
          make_branch 'paper/paper4-degree-help-seeking' 'paper4_degree_help_seeking' 'Paper 4 — degree help-seeking'
          make_branch 'paper/paper5-longitudinal-trajectories' 'paper5_longitudinal_trajectories' 'Paper 5 — longitudinal trajectories'

          git checkout main
