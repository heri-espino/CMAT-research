name: Generate code function index

on:
  push:
    paths:
      - 'code/**/*.py'
      - '.github/workflows/generate-function-index.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate AST index
        run: python code/scripts/generate_function_index.py
      - name: Commit generated index
        run: |
          if test -z "$(git status --porcelain -- code/FUNCTION_INDEX.md)"; then
            echo 'Index is already current.'
            exit 0
          fi
          git config user.name 'CMAT documentation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add code/FUNCTION_INDEX.md
          git commit -m 'docs: generate active code function index'
          git push
