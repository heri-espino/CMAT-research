          def annotation_text(node: ast.AST | None) -> str:
              return ast.unparse(node) if node is not None else 'object'

          def default_text(node: ast.AST | None) -> str:
              if node is None:
                  return ''
              try:
                  return f", default={ast.unparse(node)}"
              except Exception:
                  return ', optional'

          def parameter_records(node: ast.FunctionDef | ast.AsyncFunctionDef) -> list[tuple[str, str, str]]:
              args = list(node.args.posonlyargs) + list(node.args.args)
              positional_defaults = [None] * (len(args) - len(node.args.defaults)) + list(node.args.defaults)
              records: list[tuple[str, str, str]] = []
              for arg, default in zip(args, positional_defaults):
                  if arg.arg in {'self', 'cls'}:
                      continue
                  records.append((arg.arg, annotation_text(arg.annotation), default_text(default)))
              if node.args.vararg is not None:
                  records.append(('*' + node.args.vararg.arg, annotation_text(node.args.vararg.annotation), ''))
              for arg, default in zip(node.args.kwonlyargs, node.args.kw_defaults):
                  records.append((arg.arg, annotation_text(arg.annotation), default_text(default)))
              if node.args.kwarg is not None:
                  records.append(('**' + node.args.kwarg.arg, annotation_text(node.args.kwarg.annotation), ''))
              return records

          def params_block(name: str, node: ast.FunctionDef | ast.AsyncFunctionDef) -> str:
              records = parameter_records(node)
              if not records:
                  return ''
              lines = ['Parameters', '----------']
              for param, ann, default in records:
                  bare = param.lstrip('*')
                  desc = PARAM_OVERRIDE.get((name, bare), PARAM_DOC.get(bare))
                  if desc is None:
                      if bare.endswith('_col'):
                          desc = 'Column name used by the computation.'
                      elif bare.startswith('min_'):
                          desc = 'Minimum value required by the stated filtering or stability rule.'
                      elif bare.startswith('max_'):
                          desc = 'Maximum value used by the stated range or truncation rule.'
                      else:
                          desc = 'Input value used by the documented computation.'
                  lines += [f'{param} : {ann}{default}', f'    {desc}']
              return '\n'.join(lines)

          def return_block(name: str, node: ast.FunctionDef | ast.AsyncFunctionDef) -> str:
              if node.returns is None:
                  return ''
              ret = ast.unparse(node.returns)
              if ret in {'None', 'NoneType'}:
                  return ''
              desc = RETURN_DOC.get(name, 'Computed table or tables containing the quantities described above.')
              return f'Returns\n-------\n{ret}\n    {desc}'

          def build_doc(name: str, node: ast.FunctionDef | ast.AsyncFunctionDef | ast.ClassDef) -> str:
              if isinstance(node, ast.ClassDef) and name in FULL_CLASS_DOCS:
                  return FULL_CLASS_DOCS[name].strip()
              existing = ast.get_docstring(node, clean=True) or SUMMARIES.get(name, name.replace('_', ' ').capitalize() + '.')
              if isinstance(node, ast.ClassDef):
                  return existing.strip()
              pblock = params_block(name, node)
              rblock = return_block(name, node)
              doc = existing.strip()
              if pblock and 'Parameters\n----------' not in doc:
                  marker = '\nReturns\n-------'
                  if marker in doc:
                      doc = doc.replace(marker, '\n\n' + pblock + marker, 1)
                  else:
                      doc += '\n\n' + pblock
              if rblock and 'Returns\n-------' not in doc:
                  doc += '\n\n' + rblock
              note = EXTRA_NOTES.get(name)
              if note and note not in doc:
                  doc += '\n\nNotes\n-----\n' + note
              return doc

          def replace_docstrings(path: Path, targets: set[str]) -> None:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source, filename=str(path))
              lines = source.splitlines(keepends=True)
              edits: list[tuple[int, int, list[str]]] = []
              found: set[str] = set()
              for node in tree.body:
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      continue
                  if node.name not in targets:
                      continue
                  found.add(node.name)
                  doc = build_doc(node.name, node)
                  rendered = ['    """' + doc.splitlines()[0] + '\n']
                  rendered += ['    ' + line + '\n' for line in doc.splitlines()[1:]]
                  rendered += ['    """\n']
                  old_doc = node.body[0] if node.body and isinstance(node.body[0], ast.Expr) and isinstance(getattr(node.body[0], 'value', None), ast.Constant) and isinstance(node.body[0].value.value, str) else None
                  if old_doc is not None:
                      edits.append((old_doc.lineno - 1, old_doc.end_lineno, rendered))
                  else:
                      insert_at = node.body[0].lineno - 1
                      edits.append((insert_at, insert_at, rendered))
              missing = targets - found
              if missing:
                  raise RuntimeError(f'{path}: public targets not found: {sorted(missing)}')
              for start, end, rendered in sorted(edits, reverse=True):
                  lines[start:end] = rendered
              path.write_text(''.join(lines), encoding='utf-8')

          # Safe annotation-only improvements. No defaults or executable logic change.
          cleaning = PKG / 'preprocessing/_cleaning.py'
          text = cleaning.read_text(encoding='utf-8')
          text = text.replace(
              'def get_salones_with_imputations(materias):',
              'def get_salones_with_imputations(\n    materias: pd.DataFrame,\n) -> dict[tuple[object, object, object, object], pd.DataFrame]:',
          )
          cleaning.write_text(text, encoding='utf-8')

          style = PKG / 'visualization/style.py'
          text = style.read_text(encoding='utf-8')
          text = text.replace('def mpl_apply():', 'def mpl_apply() -> None:')
          text = text.replace('def set_style():', 'def set_style() -> None:')
          text = text.replace(
              'def plotly_apply(palette=["#ffa600", "#ffd380"], fontsize=18, fontstack="EB Garamond, Garamond, Georgia, \'Times New Roman\', serif"):',
              'def plotly_apply(\n    palette: list[str] = ["#ffa600", "#ffd380"],\n    fontsize: float = 18,\n    fontstack: str = "EB Garamond, Garamond, Georgia, \'Times New Roman\', serif",\n) -> None:',
          )
          style.write_text(text, encoding='utf-8')

          for path, targets in SOURCE_TARGETS.items():
              replace_docstrings(path, targets)

          # Canonical modules whose public implementation lives directly in the file.
          style = PKG / 'visualization/style.py'
          text = style.read_text(encoding='utf-8')
          if not ast.get_docstring(ast.parse(text)):
              text = '"""Shared Matplotlib, Seaborn, and Plotly style configuration.\n\nThe functions in this module change plotting-library defaults only; they do not\nconstruct cohorts, transform analytical data, or alter statistical estimands.\n"""\n\n' + text
              style.write_text(text, encoding='utf-8')

          provenance = PKG / 'reporting/provenance.py'
          text = provenance.read_text(encoding='utf-8')
          if not ast.get_docstring(ast.parse(text)):
              text = '"""Reproducibility and run-provenance logging utilities.\n\nRun logs record file metadata and execution context without reading or modifying\nthe analytical contents of the controlled input files.\n"""\n\n' + text
              provenance.write_text(text, encoding='utf-8')

          # Sphinx: exact reviewed API only. No recursive discovery and no compatibility modules.
          api_lines = [
              'Public API reference',
              '====================',
              '',
              'This reference is intentionally restricted to symbols exported by the',
              'reviewed canonical namespace ``__all__`` declarations. Compatibility',
              'namespaces, private implementation modules, historical pipelines, and',
              'non-exported helpers are excluded.',
              '',
          ]
          for module_name, symbols in PUBLIC_API.items():
              title = module_name.replace('cmat_analysis.', '') or 'cmat_analysis'
              api_lines += [title, '-' * len(title), '', f'.. automodule:: {module_name}', '']
              if not symbols:
                  api_lines += ['This namespace currently exposes no stable public callables.', '']
              for symbol, kind in symbols:
                  directive = 'autoclass' if kind == 'class' else 'autofunction'
                  api_lines += [f'.. {directive}:: {module_name}.{symbol}', '   :no-index-entry:', '']
          (ROOT / 'docs/api/index.rst').write_text('\n'.join(api_lines), encoding='utf-8')

          # Human-readable inventory synchronized with the executable contract.
          md = [
              '# cmat_analysis public API',
              '',
              'This inventory defines the reviewed documentation surface. A symbol is',
              'public here only when it is exported from the canonical namespace',
              '`__all__`. Compatibility namespaces and non-exported helpers are not API.',
              '',
          ]
          fn_count = 0
          cls_count = 0
          for module_name, symbols in PUBLIC_API.items():
              md += [f'## `{module_name}`', '']
              if not symbols:
                  md += ['No public callables.', '']
                  continue
              for symbol, kind in symbols:
                  md.append(f'- `{symbol}` — {kind}')
                  fn_count += kind == 'function'
                  cls_count += kind == 'class'
              md.append('')
          md += [f'Public functions: **{fn_count}**  ', f'Public classes: **{cls_count}**', '']
          (ROOT / 'PUBLIC_API.md').write_text('\n'.join(md), encoding='utf-8')
          PY

          git config user.name 'CMAT documentation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cmat_analysis
          git commit -m 'docs: complete canonical public API reference'
          git push origin HEAD:main
