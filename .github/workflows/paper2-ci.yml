name: Paper 2 recipe CI

on:
  push:
    branches:
      - 'paper/paper2-mu-performance'
    paths:
      - 'code/**'
      - 'paper/**'
      - 'literature_selected/**'
      - 'results/README.md'
      - 'PAPER_BRANCH.md'
      - 'cmat_analysis/**'
      - '.github/workflows/paper2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 2
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile Python entry points
        run: python -m py_compile code/run_paper.py code/figures.py paper/build.py

      - name: Validate Paper 2 recipe without private data
        run: python code/run_paper.py --check

      - name: Generate retained-snapshot vector figures
        run: python code/figures.py --source retained

      - name: Verify figure output is PDF only
        shell: bash
        run: |
          test -f results/figures/fig01_mu_visit_distribution.pdf
          test -f results/figures/fig02_mu_performance_by_visit_group.pdf
          test -f results/figures/fig03_adjusted_dose_coefficients.pdf
          test -f results/figures/fig04_outcome_sensitivity.pdf
          if find results/figures -maxdepth 1 -type f -name '*.png' | grep -q .; then
            echo 'Unexpected PNG publication figure found.' >&2
            exit 1
          fi

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern

      - name: Compile Paper 2 manuscript
        run: python paper/build.py
