name: Paper 2 recipe CI

on:
  push:
    branches:
      - 'paper/paper2-mu-performance'
    paths:
      - 'code/**'
      - 'paper/**'
      - 'literature_selected/**'
      - 'results/**'
      - 'data/controlled/**'
      - 'PAPER_BRANCH.md'
      - 'cmat_analysis/**'
      - '.github/workflows/paper2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 2
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile Python entry points
        run: python -m py_compile code/run_paper.py code/figures.py paper/build.py

      - name: Validate Paper 2 recipe without row-level reads
        run: python code/run_paper.py --check

      - name: Run controlled Paper 2 analysis
        run: |
          python code/run_paper.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv \
            --diagnostico data/controlled/Diagnostico_pseudonymized.csv

      - name: Verify exact-group and diagnostic outputs
        shell: bash
        run: |
          for f in \
            results/tables/30_exact_visit_groups_summary.csv \
            results/tables/31_exact_visit_groups_welch_anova.csv \
            results/tables/32_exact_visit_groups_games_howell.csv \
            results/tables/33_exact_visit_groups_fe_pairwise.csv \
            results/tables/34_exact_visit_groups_fe_model_info.csv \
            results/tables/35_diagnostic_coverage_by_exact_visit_group.csv; do
            test -s "$f"
          done
          # The diagnostic-adjusted model table may contain no rows when the
          # available diagnostic extract has no same-term overlap with Paper 2.
          test -e results/tables/36_diagnostic_adjusted_exact_visit_models.csv
          test -f results/figures/fig01_mu_visit_distribution.pdf
          test -f results/figures/fig02_mu_performance_by_visit_group.pdf
          test -f results/figures/fig03_adjusted_dose_coefficients.pdf
          if find results/figures -maxdepth 1 -type f -name '*.png' | grep -q .; then
            echo 'Unexpected PNG publication figure found.' >&2
            exit 1
          fi

      - name: Upload aggregate confirmatory outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper2-exact-groups-${{ github.sha }}
          path: |
            results/tables/*.csv
            results/figures/*.pdf
            results/run_summary.json
          if-no-files-found: error
          retention-days: 30

      # Manuscript compilation and source export are centralized in
      # .github/workflows/paper-build.yml, shared from main.
