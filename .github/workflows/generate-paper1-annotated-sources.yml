name: Generate Paper 1 annotated sources

on:
  push:
    paths:
      - 'literature/library/articles/*.md'
      - 'papers/paper1_ppa_persistence/literature/reading_notes/**/*.md'
      - 'papers/paper1_ppa_persistence/literature/notes_on_papers/_generate.py'
      - '.github/workflows/generate-paper1-annotated-sources.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate annotation anchors
        run: python papers/paper1_ppa_persistence/literature/notes_on_papers/_generate.py --check
      - name: Generate annotated reading copies
        run: python papers/paper1_ppa_persistence/literature/notes_on_papers/_generate.py --write
      - name: Commit generated copies
        run: |
          if test -z "$(git status --porcelain -- papers/paper1_ppa_persistence/literature/notes_on_papers)"; then
            echo 'Annotated source copies are already current.'
            exit 0
          fi
          git config user.name 'CMAT documentation bot'
          git config user.email 'actions@users.noreply.github.com'
          git add papers/paper1_ppa_persistence/literature/notes_on_papers/*.md
          git commit -m 'docs: generate Paper 1 annotated source copies'
          git push
