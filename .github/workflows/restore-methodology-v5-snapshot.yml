name: Restore methodology v5 snapshot

on:
  push:
    branches:
      - restore/methodology-v5-report-v2
    paths:
      - '.github/workflows/restore-methodology-v5-snapshot.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover original methodology patch from repository history
        shell: bash
        run: |
          set -euo pipefail
          git show a1badecf897a7426725212e3c646e3003d8371e9:scripts/patches/methodology_v5.tar.gz.b64 > /tmp/methodology_v5.tar.gz.b64
          base64 -d /tmp/methodology_v5.tar.gz.b64 > /tmp/methodology_v5.tar.gz
          echo "Recovered historical patch SHA-256: $(sha256sum /tmp/methodology_v5.tar.gz | cut -d' ' -f1)"
          echo "Historical Git blob identity: 69705e2b22876cff97fcf3df029e37c47072c59e"

      - name: Build navigable methodology-v5 snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAP='code/snapshots/methodology_v5_2026-09-07'
          TMP='/tmp/cmat_methodology_v5_code'
          rm -rf "$TMP" "$SNAP"
          mkdir -p "$TMP" "$SNAP"

          rsync -a code/ "$TMP/" \
            --exclude 'snapshots/' \
            --exclude 'outputs/' \
            --exclude 'legacy/' \
            --exclude 'manual/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc'

          tar -xzf /tmp/methodology_v5.tar.gz -C "$TMP"
          rsync -a "$TMP/" "$SNAP/" --exclude '__pycache__/' --exclude '*.pyc'

          cat > "$SNAP/README_RECOVERY.md" <<'EOF'
          # Recovered methodology v5 code snapshot

          This directory preserves the sanitized scientific-code line associated with the 2026-09-07 methodology update and the methodology-v2 technical report.

          The later methodology patch was recovered from Git object history (`a1badecf897a7426725212e3c646e3003d8371e9`) and then validated file-by-file against SHA-256 hashes calculated from the original `CMAT_methodology_update_bundle.zip` re-uploaded by the project owner on 2026-09-07.

          Declared scientific-source fingerprint of the original sanitized methodology snapshot:
          `03dd3d4ddd31cc2263be54900e1b25749fab8a7beb2033fbe796bf240fd4c39f`.

          Primary first-MU cohort: `N=6,627`. Future-Calculus progressor sensitivity: `N=4,211`. The refined `N=3,241` longitudinal stage is later work and is intentionally not claimed to be covered by that fingerprint.

          This is a provenance snapshot, not a second canonical pipeline. Scientific changes should ultimately be reconciled into the single canonical `code/` path.
          EOF

      - name: Verify key files against the re-uploaded bundle
        shell: bash
        run: |
          set -euo pipefail
          SNAP='code/snapshots/methodology_v5_2026-09-07'
          cd "$SNAP"
          cat > /tmp/expected.sha256 <<'EOF'
          ce25dc82a56555bd20183b6ad24929bdabd68a524ed250a36eff56a68ffd18f1  config/study_config.py
          23e1814b718d06b6e0b1e8b6683cdb4d27b309fde0d798e3fbb2c743fd10a6ef  src/visitas_analysis/study/outcomes.py
          0e5064b255d29e0b72bf24bd20ea717c827c34473045410794137ef04f20a5de  src/visitas_analysis/study/pipeline.py
          449b9bf1cb3d38674bab2c7f10c58e40993e8541a72ef05d4e285cf5525e36ea  src/visitas_analysis/study/plots.py
          2bb743399ce70994023a6f316f7a0b2b5eac9b27ed21bf493f53ce5fa147669a  src/visitas_analysis/study/extended_methodology.py
          a3a6d3851928cbaf37275642555b484633cb3e2215e1c183bcf4f3dc5c316a78  src/visitas_analysis/study/extended_plots.py
          8d44d5fddf10bd213fa7013b9895af5e636a3f07658f6070e55926214310a980  tests/test_study_helpers.py
          2d0224d37285f3d84ed48038a9c81fce4538f2dbe67d92ffd44fdd32f80f4dd0  STUDY_PROTOCOL.md
          1f5c014309f09dd2d227b4e3a2eb9387ae07bc6c4dc8537464c089d5495a4c4b  PYTHON_FUNCTION_INDEX.md
          a5d9c180b50055b1a5f5361475e3414cb5fe77e3874ea8a94a2b5b2b16634385  METHODOLOGY_CHANGELOG.md
          f6b16993d9890149273c39c98ab8e923210402e14800e2937e1feeafcde47841  .ai_handoff.md
          1b313479667a44a24d7876ff2e3d2fc7d1fb72249519c80eb0f6db8c5a04ce44  SOURCE_MANIFEST_SHA256.txt
          EOF
          sha256sum -c /tmp/expected.sha256

      - name: Privacy and tests
        shell: bash
        run: |
          set -euo pipefail
          SNAP='code/snapshots/methodology_v5_2026-09-07'
          if find "$SNAP" -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.parquet' -o -iname '*.feather' -o -iname '*.sav' -o -iname '*.dta' -o -iname '*.sas7bdat' \) | grep -q .; then
            echo 'ERROR: raw-data file detected in recovered snapshot' >&2
            exit 1
          fi
          python -m pip install --quiet pytest numpy pandas scipy statsmodels matplotlib pingouin scikit-learn openpyxl
          PYTHONPATH="$SNAP/src:$SNAP" python -m pytest -q "$SNAP/tests/test_study_helpers.py"

      - name: Commit recovered snapshot and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMAT research restoration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f code/snapshots/methodology_v5_2026-09-07
          git rm -f .github/workflows/restore-methodology-v5-snapshot.yml
          git commit -m 'restore: recover sanitized methodology v5 code snapshot'
          git push origin HEAD:restore/methodology-v5-report-v2
