name: Simplify literature library

on:
  push:
    paths:
      - '.github/workflows/simplify-literature-library.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Prepare verified migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/simplify_literature.py')
          text = p.read_text()
          old = """            for p in d.iterdir():\n                if p.is_file():\n                    candidates.setdefault(p.name, []).append(p)\n"""
          new = """            suffix = '.pdf' if kind == 'pdf' else '.md'\n            for p in d.iterdir():\n                if p.is_file() and p.suffix.lower() == suffix:\n                    candidates.setdefault(p.name, []).append(p)\n"""
          if old not in text:
              raise SystemExit('expected verifier block not found')
          p.write_text(text.replace(old, new))
          PY
          python .github/scripts/simplify_literature.py
          python - <<'PY'
          from pathlib import Path
          targeted = {
              'literature/papers/paper1_ppa_persistence/MISSING_LITERATURE.md': [('../../library/source_material/', '../../library/')],
              'literature/papers/paper2_mu_performance/MISSING_LITERATURE.md': [('../../library/source_material/', '../../library/')],
              'literature/papers/README.md': [('../library/source_material/', '../library/')],
          }
          for fn, reps in targeted.items():
              p = Path(fn)
              text = p.read_text()
              for old, new in reps:
                  text = text.replace(old, new)
              p.write_text(text)

          p = Path('literature/papers/paper1_ppa_persistence/reading_notes/general/fong_2023.md')
          text = p.read_text()
          text = text.replace('\n`literature/library/source_material/visual_corpus/assets/fong_2023_academic-help-seeking-achievement/`\n', '\n')
          p.write_text(text)
          PY

      - name: Remove redundant hierarchy
        run: |
          set -euo pipefail
          git rm -r literature/library/source_material
          git rm -r literature/library/assets
          git rm literature/library/INDEX.md

      - name: Validate final tree
        run: |
          set -euo pipefail
          test -d literature/library/articles
          test -d literature/library/pdf
          test -d literature/library/references
          test -f literature/library/CATALOG.md
          test ! -e literature/library/source_material
          test ! -e literature/library/assets
          test ! -e literature/library/INDEX.md
          if grep -RIn --include='*.md' 'library/source_material/' literature AI_HANDOFF.md docs; then
            echo 'Found stale source_material path(s)' >&2
            exit 1
          fi
          if grep -RIn --include='*.md' 'library/INDEX.md' literature AI_HANDOFF.md docs; then
            echo 'Found stale library/INDEX.md reference(s)' >&2
            exit 1
          fi

      - name: Commit migration and remove temporary migration files
        run: |
          set -euo pipefail
          git rm .github/workflows/simplify-literature-library.yml
          git rm .github/scripts/simplify_literature.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'literature: simplify canonical library structure'
          git push origin HEAD:main
