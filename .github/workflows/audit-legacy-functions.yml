name: Audit legacy functions

on:
  push:
    branches:
      - admin/audit-legacy-functions

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Check out historical brainstorm
        uses: actions/checkout@v4
        with:
          ref: brainstorm/proyecto-visitas
          path: legacy
          fetch-depth: 1
          lfs: false

      - name: Compare Python functions
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          legacy_root = Path('legacy/brainstorm/proyecto_visitas/src/visitas_analysis')
          main_root = Path('main/cmat_analysis/src/cmat_analysis')

          def signature(node):
              args = node.args
              pos = [a.arg for a in args.posonlyargs + args.args]
              kwonly = [a.arg for a in args.kwonlyargs]
              return {
                  'positional': pos,
                  'vararg': args.vararg.arg if args.vararg else None,
                  'kwonly': kwonly,
                  'kwarg': args.kwarg.arg if args.kwarg else None,
                  'defaults': len(args.defaults),
                  'kw_defaults': [x is not None for x in args.kw_defaults],
              }

          def normalized_hash(node):
              clone = ast.FunctionDef(
                  name='f', args=node.args, body=node.body,
                  decorator_list=[], returns=node.returns,
                  type_comment=getattr(node, 'type_comment', None),
              )
              return hashlib.sha256(ast.dump(clone, include_attributes=False).encode()).hexdigest()

          def scan(root):
              rows = []
              for path in sorted(root.rglob('*.py')):
                  try:
                      text = path.read_text(encoding='utf-8')
                      tree = ast.parse(text)
                  except Exception as e:
                      rows.append({'module': str(path.relative_to(root)), 'parse_error': repr(e)})
                      continue
                  for node in tree.body:
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          rows.append({
                              'module': str(path.relative_to(root)),
                              'name': node.name,
                              'lineno': node.lineno,
                              'signature': signature(node),
                              'doc': ast.get_docstring(node),
                              'hash': normalized_hash(node),
                              'private': node.name.startswith('_'),
                          })
              return rows

          legacy = scan(legacy_root)
          main = scan(main_root)
          main_by_name = {}
          main_by_hash = {}
          for r in main:
              if 'name' in r:
                  main_by_name.setdefault(r['name'], []).append(r)
                  main_by_hash.setdefault(r['hash'], []).append(r)

          audit = []
          for r in legacy:
              if 'name' not in r:
                  audit.append({**r, 'status': 'parse_error'})
                  continue
              by_name = main_by_name.get(r['name'], [])
              by_hash = main_by_hash.get(r['hash'], [])
              if by_name:
                  status = 'same_name_in_main'
              elif by_hash:
                  status = 'same_body_different_name'
              else:
                  status = 'absent_by_name_and_body'
              audit.append({**r, 'status': status, 'main_name_matches': by_name, 'main_hash_matches': by_hash})

          Path('audit').mkdir()
          Path('audit/legacy_functions.json').write_text(json.dumps(legacy, indent=2, ensure_ascii=False), encoding='utf-8')
          Path('audit/main_functions.json').write_text(json.dumps(main, indent=2, ensure_ascii=False), encoding='utf-8')
          Path('audit/comparison.json').write_text(json.dumps(audit, indent=2, ensure_ascii=False), encoding='utf-8')

          lines = ['# Legacy function audit', '', '| Legacy module | Function | Visibility | Status | Main match |', '|---|---|---|---|---|']
          for r in audit:
              if 'name' not in r:
                  continue
              matches = [m['module'] + ':' + m['name'] for m in r.get('main_name_matches', [])]
              matches += [m['module'] + ':' + m['name'] for m in r.get('main_hash_matches', [])]
              lines.append(f"| `{r['module']}` | `{r['name']}` | {'private' if r['private'] else 'public'} | `{r['status']}` | {', '.join(matches)} |")
          Path('audit/REPORT.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: legacy-function-audit
          path: audit/
