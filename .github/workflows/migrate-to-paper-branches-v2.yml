name: Migrate to paper branches v2

on:
  push:
    paths:
      - '.github/workflows/migrate-to-paper-branches-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run guarded repository migration
        run: python .github/scripts/migrate_repo_layout.py
