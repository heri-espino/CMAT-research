name: Clean restored snapshot packaging metadata

on:
  push:
    branches:
      - restore/exact-methodology-v5-report-v2
    paths:
      - '.github/workflows/cleanup-restored-snapshot.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Remove non-scientific packaging/cache metadata
        shell: bash
        run: |
          set -euo pipefail
          CODE='code/snapshots/methodology_v5_2026-09-07'
          REPORT='reports/technical_report_methodology_v2'
          find "$CODE" "$REPORT" -type d -name '__MACOSX' -prune -exec rm -rf {} + || true
          find "$CODE" "$REPORT" -type d -name '.pytest_cache' -prune -exec rm -rf {} + || true
          find "$CODE" "$REPORT" -type f -name '.DS_Store' -delete || true

          # Ensure scientific manifests are still fully valid after deleting only
          # metadata that was not listed in those manifests.
          (cd "$CODE" && sha256sum -c SOURCE_MANIFEST_SHA256.txt >/dev/null)
          (cd "$REPORT" && sha256sum -c provenance/SHA256SUMS.txt >/dev/null)

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMAT research restoration bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/cleanup-restored-snapshot.yml
          git add -A code/snapshots/methodology_v5_2026-09-07 reports/technical_report_methodology_v2
          git commit -m 'chore: remove non-scientific snapshot packaging metadata'
          git push origin HEAD:restore/exact-methodology-v5-report-v2
