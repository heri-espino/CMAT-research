name: Paper 2.1 skew-normal shape check

on:
  push:
    branches:
      - 'paper/paper2.1-visit-frequency'
    paths:
      - 'code/run_paper21_shape_check.py'
      - '.github/workflows/paper2-1-shape-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 2.1
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile shape-check runner
        run: python -m py_compile code/run_paper21_shape_check.py

      - name: Test reusable mixture estimators
        run: python -m pytest cmat_analysis/tests/test_mixtures.py -q

      - name: Compare Gaussian, skew-normal, and two-Gaussian fits
        run: |
          python code/run_paper21_shape_check.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv

      - name: Verify shape-check outputs
        run: |
          test -s results/paper21/tables/47_complete_case_skewnormal_vs_gmm.csv
          test -s results/paper21/tables/48_imputed_skewnormal_vs_gmm.csv

      - name: Upload shape-check tables
        uses: actions/upload-artifact@v4
        with:
          name: paper21-skewnormal-shape-${{ github.sha }}
          path: |
            results/paper21/tables/47_complete_case_skewnormal_vs_gmm.csv
            results/paper21/tables/48_imputed_skewnormal_vs_gmm.csv
          if-no-files-found: error
          retention-days: 30
