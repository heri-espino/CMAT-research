name: Canonicalize cmat_analysis imports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cmat-analysis-canonicalize-imports.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Move reusable methodology code and canonicalize imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('cmat_analysis')
          pkg = root / 'src/cmat_analysis'

          def replace(path: Path, replacements: dict[str, str]) -> None:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Reusable methodology statistics: preserve implementation and alter
          # only its dependency imports, plus a module-level documentation header.
          legacy_method = pkg / 'study/extended_methodology.py'
          method_text = legacy_method.read_text(encoding='utf-8')
          method_text = method_text.replace(
              'from .cohort import attach_visits',
              'from cmat_analysis.cohorts import attach_visits',
          ).replace(
              'from .outcomes import add_primary_outcomes',
              'from cmat_analysis.measures import add_primary_outcomes',
          )
          header = '''\"\"\"Reusable methodology diagnostics for visit-dose and subgroup analyses.\n\nThe functions in this module originated in the methodology report but implement\nscientific comparisons that are reusable across CMAT analyses. The architectural\nmove changes import paths only; statistical formulas, cohort definitions,\nthresholds, and estimands are unchanged.\n\nNotes\n-----\nThese procedures analyze observational service-use data. Unless an individual\nfunction documents an identifying design, reported associations must not be\ninterpreted as causal effects.\n\"\"\"\n\n'''
          if not method_text.startswith('"""'):
              method_text = header + method_text
          canonical_method = pkg / 'statistics/methodology.py'
          canonical_method.write_text(method_text, encoding='utf-8')
          legacy_method.write_text(
              '"""Deprecated compatibility path for :mod:`cmat_analysis.statistics.methodology`."""\n\n'
              'from cmat_analysis.statistics.methodology import *  # noqa: F401,F403\n',
              encoding='utf-8',
          )

          # Methodology figures are reusable visualization code and are moved
          # without changing figure calculations.
          legacy_plots = pkg / 'study/methodology_plots.py'
          plots_text = legacy_plots.read_text(encoding='utf-8')
          plot_header = '''\"\"\"Reusable figures for methodology and visit-dose diagnostics.\n\nPlot functions consume already-computed analytical tables and do not define\ncohorts, exposure rules, or statistical estimands.\n\"\"\"\n\n'''
          if not plots_text.startswith('"""'):
              plots_text = plot_header + plots_text
          canonical_plots = pkg / 'visualization/methodology.py'
          canonical_plots.write_text(plots_text, encoding='utf-8')
          legacy_plots.write_text(
              '"""Deprecated compatibility path for :mod:`cmat_analysis.visualization.methodology`."""\n\n'
              'from cmat_analysis.visualization.methodology import *  # noqa: F401,F403\n',
              encoding='utf-8',
          )

          # Historical orchestration remains in study/, but scientific imports
          # now resolve directly to canonical responsibility-based modules.
          canonical_imports = {
              'from .cohort import ': 'from cmat_analysis.cohorts import ',
              'from .outcomes import ': 'from cmat_analysis.measures import ',
              'from .plots import ': 'from cmat_analysis.visualization.study import ',
              'from .selection import ': 'from cmat_analysis.statistics.selection import ',
              'from .extended_analysis import ': 'from cmat_analysis.statistics.group_comparisons import ',
              'from .extended_plots import ': 'from cmat_analysis.visualization.exploratory import ',
              'from .ppa_progression import ': 'from cmat_analysis.ppa.progression import ',
              'from .ppa_plots import ': 'from cmat_analysis.visualization.ppa import ',
              'from .temporal import ': 'from cmat_analysis.longitudinal.temporal import ',
              'from .statistics import ': 'from cmat_analysis.statistics.inference import ',
              'from .extended_methodology import ': 'from cmat_analysis.statistics.methodology import ',
              'from .methodology_plots import ': 'from cmat_analysis.visualization.methodology import ',
          }
          replace(pkg / 'study/pipeline.py', canonical_imports)
          replace(pkg / 'study/methodology_pipeline.py', canonical_imports)

          # Other active library consumers use canonical cleaning imports.
          for rel in [
              'reporting/descriptive_pipeline.py',
              'analysis/report_compatible/context.py',
              'analysis/raw_report_figures.py',
          ]:
              replace(pkg / rel, {
                  'from cmat_analysis.analysis.cleaning import ': 'from cmat_analysis.preprocessing import ',
              })

          # Tests now exercise canonical APIs rather than merely validating shims.
          replace(root / 'tests/test_study_helpers.py', {
              'from cmat_analysis.study.cohort import ': 'from cmat_analysis.cohorts import ',
              'from cmat_analysis.study.temporal import ': 'from cmat_analysis.longitudinal import ',
              'from cmat_analysis.study.ppa_progression import ': 'from cmat_analysis.ppa import ',
              'from cmat_analysis.study.extended_analysis import one_two_pooling_analysis, longitudinal_any_visit_transition':
                  'from cmat_analysis.statistics.group_comparisons import one_two_pooling_analysis\n    from cmat_analysis.longitudinal import longitudinal_any_visit_transition',
              'from cmat_analysis.study.extended_analysis import ': 'from cmat_analysis.statistics.group_comparisons import ',
          })
          replace(root / 'tests/test_methodology_report_helpers.py', {
              'from cmat_analysis.study.extended_methodology import ': 'from cmat_analysis.statistics.methodology import ',
              'from cmat_analysis.study.outcomes import ': 'from cmat_analysis.measures import ',
          })

          # Expose the two most frequently reused methodology helpers at the
          # statistics namespace while keeping the rest available by module.
          stat_init = pkg / 'statistics/__init__.py'
          text = stat_init.read_text(encoding='utf-8')
          marker = 'from .selection import propensity_att_sensitivity\n'
          addition = '''from .methodology import add_exact_visit_group, games_howell_exact_groups\n'''
          if addition not in text:
              text = text.replace(marker, marker + addition)
          for name in ['add_exact_visit_group', 'games_howell_exact_groups']:
              token = f'    "{name}",\n'
              if token not in text:
                  text = text.replace('    "bunching_metrics",\n', token + '    "bunching_metrics",\n')
          stat_init.write_text(text, encoding='utf-8')

          # Keep migration documentation synchronized with the actual tree.
          migration = root / 'MIGRATION_MAP.md'
          text = migration.read_text(encoding='utf-8')
          anchor = '| `study/extended_analysis.py` | robust/group/career comparisons | `statistics/group_comparisons.py` | moved; old path is shim |\n'
          rows = (
              '| `study/extended_methodology.py` | reusable visit-dose methodology diagnostics | `statistics/methodology.py` | moved; old path is shim |\n'
              '| `study/methodology_plots.py` | methodology figures | `visualization/methodology.py` | moved; old path is shim |\n'
          )
          if rows not in text:
              text = text.replace(anchor, anchor + rows)
          text = text.replace(
              '`study/methodology_plots.py`, `study/extended_methodology.py`, ',
              '',
          )
          migration.write_text(text, encoding='utf-8')

          arch = root / 'ARCHITECTURE.md'
          text = arch.read_text(encoding='utf-8')
          text = text.replace(
              '`study/methodology_pipeline.py`, `reporting/methodology_build.py`, `reporting/methodology_report.py`, and the raw-report compatibility stack',
              '`study/methodology_pipeline.py`, `reporting/methodology_build.py`, `reporting/methodology_report.py`, and the raw-report compatibility stack',
          )
          arch.write_text(text, encoding='utf-8')

          api = root / 'docs/api/index.rst'
          text = api.read_text(encoding='utf-8')
          if '   cmat_analysis.statistics.methodology\n' not in text:
              text = text.replace(
                  '   cmat_analysis.statistics.group_comparisons\n',
                  '   cmat_analysis.statistics.group_comparisons\n   cmat_analysis.statistics.methodology\n',
              )
          if '   cmat_analysis.visualization.methodology\n' not in text:
              text = text.replace(
                  '   cmat_analysis.visualization.grade_distributions\n',
                  '   cmat_analysis.visualization.grade_distributions\n   cmat_analysis.visualization.methodology\n',
              )
          api.write_text(text, encoding='utf-8')
          PY

          git config user.name 'CMAT refactor bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            cmat_analysis/src/cmat_analysis/statistics/methodology.py \
            cmat_analysis/src/cmat_analysis/statistics/__init__.py \
            cmat_analysis/src/cmat_analysis/visualization/methodology.py \
            cmat_analysis/src/cmat_analysis/study/extended_methodology.py \
            cmat_analysis/src/cmat_analysis/study/methodology_plots.py \
            cmat_analysis/src/cmat_analysis/study/pipeline.py \
            cmat_analysis/src/cmat_analysis/study/methodology_pipeline.py \
            cmat_analysis/src/cmat_analysis/reporting/descriptive_pipeline.py \
            cmat_analysis/src/cmat_analysis/analysis/report_compatible/context.py \
            cmat_analysis/src/cmat_analysis/analysis/raw_report_figures.py \
            cmat_analysis/tests/test_study_helpers.py \
            cmat_analysis/tests/test_methodology_report_helpers.py \
            cmat_analysis/MIGRATION_MAP.md \
            cmat_analysis/ARCHITECTURE.md \
            cmat_analysis/docs/api/index.rst
          git commit -m 'refactor: canonicalize scientific imports and methodology modules'
          git push origin HEAD:main
