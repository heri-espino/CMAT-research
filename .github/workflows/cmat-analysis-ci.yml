name: cmat_analysis CI

on:
  push:
    branches: [main]
    paths:
      - 'cmat_analysis/**'
      - '.github/workflows/cmat-analysis-ci.yml'
  pull_request:
    paths:
      - 'cmat_analysis/**'
      - '.github/workflows/cmat-analysis-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install library, tests, and docs
        run: python -m pip install -e "./cmat_analysis[dev,docs]"
      - name: Verify public imports
        run: |
          python -c "import cmat_analysis"
          python -c "from cmat_analysis.cohorts import build_study_cohorts; from cmat_analysis.measures import add_primary_outcomes"
          python -c "from cmat_analysis.statistics import robust_two_group_tests; from cmat_analysis.longitudinal import TemporalPeakConfig; from cmat_analysis.ppa import build_ppa_progression_cohort"
      - name: Run test suite
        run: pytest cmat_analysis/tests/
      - name: Build Sphinx documentation with warnings as errors
        run: sphinx-build -W -b html cmat_analysis/docs cmat_analysis/docs/_build/html
