name: Restore exact methodology v5 and report v2

on:
  push:
    branches:
      - restore/exact-methodology-v5-report-v2
    paths:
      - '.restore_payload/CMAT_publication_study_v5_methodology_sanitized.zip'
      - '.restore_payload/CMAT_latex_report_v2_methodology.zip'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout restoration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Require and verify exact ZIPs
        shell: bash
        run: |
          set -euo pipefail
          CODE_ZIP='.restore_payload/CMAT_publication_study_v5_methodology_sanitized.zip'
          REPORT_ZIP='.restore_payload/CMAT_latex_report_v2_methodology.zip'
          test -f "$CODE_ZIP"
          test -f "$REPORT_ZIP"
          echo 'd86a301278b37bcf7300fac3b12eaa200c948e4fbaa0016d049a734fba23d0b7  '"$CODE_ZIP" | sha256sum -c -
          echo '68a872de5cd348e0304945c66adb581bb95192ea2547fd3aaebcb258584941be  '"$REPORT_ZIP" | sha256sum -c -

      - name: Extract exact scientific package
        shell: bash
        run: |
          set -euo pipefail
          CODE_DST='code/snapshots/methodology_v5_2026-09-07'
          REPORT_DST='reports/technical_report_methodology_v2'
          rm -rf "$CODE_DST" "$REPORT_DST" /tmp/cmat_code /tmp/cmat_report
          mkdir -p /tmp/cmat_code /tmp/cmat_report "$CODE_DST" "$REPORT_DST"
          unzip -q '.restore_payload/CMAT_publication_study_v5_methodology_sanitized.zip' -d /tmp/cmat_code
          unzip -q '.restore_payload/CMAT_latex_report_v2_methodology.zip' -d /tmp/cmat_report
          cp -a /tmp/cmat_code/CMAT_publication_study_v5_methodology_sanitized/. "$CODE_DST/"
          cp -a /tmp/cmat_report/CMAT_latex_report_v2_methodology/. "$REPORT_DST/"

          # Only interpreter/cache artifacts are omitted from version control.
          find "$CODE_DST" "$REPORT_DST" -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find "$CODE_DST" "$REPORT_DST" -type d -name '.pytest_cache' -prune -exec rm -rf {} + || true
          find "$CODE_DST" "$REPORT_DST" -type f \( -name '*.pyc' -o -name '.DS_Store' \) -delete || true

      - name: Verify methodology identity and privacy
        shell: bash
        run: |
          set -euo pipefail
          CODE_DST='code/snapshots/methodology_v5_2026-09-07'
          REPORT_DST='reports/technical_report_methodology_v2'

          test -f "$CODE_DST/src/visitas_analysis/study/pipeline.py"
          test -f "$CODE_DST/PYTHON_FUNCTION_INDEX.md"
          test -f "$CODE_DST/SOURCE_MANIFEST_SHA256.txt"
          test -f "$CODE_DST/.ai_handoff.md"
          test -f "$REPORT_DST/informe_cmat.tex"
          test -f "$REPORT_DST/informe_cmat.pdf"
          test -f "$REPORT_DST/referencias.bib"

          grep -q 'Complete static inventory (320 symbols)' "$CODE_DST/PYTHON_FUNCTION_INDEX.md"
          grep -q '03dd3d4ddd31cc2263be54900e1b25749fab8a7beb2033fbe796bf240fd4c39f' "$CODE_DST/.ai_handoff.md"
          grep -q 'scipy.stats.gaussian_kde' "$CODE_DST/.ai_handoff.md"
          grep -q '4,211' "$CODE_DST/.ai_handoff.md"

          echo '1e52d36809924df4bc84db65f6cb6669fe33d1f402076e8930b3a173f550595f  '"$REPORT_DST/informe_cmat.pdf" | sha256sum -c -

          if find "$CODE_DST" "$REPORT_DST" -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.parquet' -o -iname '*.feather' -o -iname '*.sav' -o -iname '*.dta' -o -iname '*.sas7bdat' \) | grep -q .; then
            echo 'ERROR: prohibited raw/binary data file found in restored package' >&2
            exit 1
          fi

      - name: Run exact snapshot tests and inspect PDF
        shell: bash
        run: |
          set -euo pipefail
          CODE_DST='code/snapshots/methodology_v5_2026-09-07'
          REPORT_DST='reports/technical_report_methodology_v2'
          python -m pip install --quiet pytest numpy pandas scipy statsmodels matplotlib pingouin scikit-learn openpyxl pypdf
          PYTHONPATH="$CODE_DST/src:$CODE_DST" python -m pytest -q "$CODE_DST/tests/test_study_helpers.py"
          python - <<'PY'
          from pypdf import PdfReader
          p = 'reports/technical_report_methodology_v2/informe_cmat.pdf'
          n = len(PdfReader(p).pages)
          print('PDF pages:', n)
          assert n == 40, n
          PY

      - name: Write restoration provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/snapshots/methodology_v5_2026-09-07
          cat > docs/snapshots/methodology_v5_2026-09-07/README.md <<'EOF'
          # Methodology v5 / technical report v2 exact restoration

          Restored from the original sanitized ZIPs supplied by the project owner.

          ## Source archives

          - `CMAT_publication_study_v5_methodology_sanitized.zip`
            - SHA-256: `d86a301278b37bcf7300fac3b12eaa200c948e4fbaa0016d049a734fba23d0b7`
          - `CMAT_latex_report_v2_methodology.zip`
            - SHA-256: `68a872de5cd348e0304945c66adb581bb95192ea2547fd3aaebcb258584941be`
          - original combined bundle provenance: `CMAT_methodology_update_bundle.zip`
            - SHA-256: `364c0b4de9b87aa9e635ba145977bfcdecfa99bfa812725e3ac66b082e18f5e8`

          ## Scientific identity

          Original sanitized scientific-source fingerprint documented by this snapshot:

          `03dd3d4ddd31cc2263be54900e1b25749fab8a7beb2033fbe796bf240fd4c39f`

          The primary first-MU cohort is N=6,627. The future-progressor MU sensitivity is N=4,211. The refined longitudinal N=3,241 analysis is a later stage and is not claimed to be covered by this fingerprint.

          ## Validation at restoration

          - 9 methodology helper tests pass.
          - `PYTHON_FUNCTION_INDEX.md` declares 320 symbols.
          - restored technical report PDF has 40 pages.
          - restored PDF SHA-256: `1e52d36809924df4bc84db65f6cb6669fe33d1f402076e8930b3a173f550595f`.
          - no original Excel microdata are included.

          Python caches, pytest caches, `.pyc`, and `.DS_Store` are deliberately omitted because they are interpreter/system artifacts, not scientific content.
          EOF

      - name: Commit exact restored package and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMAT research restoration bot'
          git config user.email 'actions@users.noreply.github.com'
          git lfs install --local

          # Remove earlier temporary recovery machinery if it exists in the branch.
          git rm -f .github/workflows/recover-methodology-v5-partial.yml 2>/dev/null || true
          git rm -f .github/workflows/finalize-methodology-v5-snapshot.yml 2>/dev/null || true
          git rm -rf .restore_payload
          git rm -f .github/workflows/restore-exact-methodology-v5.yml

          git add code/snapshots/methodology_v5_2026-09-07
          git add reports/technical_report_methodology_v2
          git add docs/snapshots/methodology_v5_2026-09-07/README.md

          git status --short
          git commit -m 'restore: add exact methodology v5 snapshot and technical report v2'
          git push origin HEAD:restore/exact-methodology-v5-report-v2
