name: Restore exact methodology v5 and report v2

on:
  push:
    branches:
      - restore/exact-methodology-v5-report-v2
    paths:
      - '.restore_payload/CMAT_publication_study_v5_methodology_sanitized.zip'
      - '.restore_payload/CMAT_latex_report_v2_methodology.zip'
      - '.github/workflows/restore-exact-methodology-v5.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout restoration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Extract uploaded archives
        shell: bash
        run: |
          set -euo pipefail
          CODE_ZIP='.restore_payload/CMAT_publication_study_v5_methodology_sanitized.zip'
          REPORT_ZIP='.restore_payload/CMAT_latex_report_v2_methodology.zip'
          test -f "$CODE_ZIP"
          test -f "$REPORT_ZIP"
          echo "Uploaded code ZIP:   $(sha256sum "$CODE_ZIP" | cut -d' ' -f1)"
          echo "Uploaded report ZIP: $(sha256sum "$REPORT_ZIP" | cut -d' ' -f1)"
          rm -rf /tmp/cmat_code /tmp/cmat_report
          mkdir -p /tmp/cmat_code /tmp/cmat_report
          unzip -q "$CODE_ZIP" -d /tmp/cmat_code
          unzip -q "$REPORT_ZIP" -d /tmp/cmat_report

          CODE_MANIFEST=$(find /tmp/cmat_code -type f -name SOURCE_MANIFEST_SHA256.txt -print -quit)
          REPORT_SUMS=$(find /tmp/cmat_report -type f -path '*/provenance/SHA256SUMS.txt' -print -quit)
          test -n "$CODE_MANIFEST"
          test -n "$REPORT_SUMS"
          dirname "$CODE_MANIFEST" > /tmp/code_root.txt
          dirname "$(dirname "$REPORT_SUMS")" > /tmp/report_root.txt
          echo "Code root:   $(cat /tmp/code_root.txt)"
          echo "Report root: $(cat /tmp/report_root.txt)"

      - name: Restore hidden handoff omitted by browser repackaging
        shell: bash
        run: |
          set -euo pipefail
          CODE_ROOT=$(cat /tmp/code_root.txt)
          if [ ! -f "$CODE_ROOT/.ai_handoff.md" ]; then
            FALLBACK='code/snapshots/methodology_v5_2026-09-07/.ai_handoff.md'
            test -f "$FALLBACK"
            echo 'f6b16993d9890149273c39c98ab8e923210402e14800e2937e1feeafcde47841  '"$FALLBACK" | sha256sum -c -
            cp "$FALLBACK" "$CODE_ROOT/.ai_handoff.md"
            echo 'Restored exact .ai_handoff.md omitted from the uploaded repackaged ZIP.'
          fi

      - name: Verify every archived file against embedded manifests
        shell: bash
        run: |
          set -euo pipefail
          CODE_ROOT=$(cat /tmp/code_root.txt)
          REPORT_ROOT=$(cat /tmp/report_root.txt)
          (cd "$CODE_ROOT" && sha256sum -c SOURCE_MANIFEST_SHA256.txt)
          (cd "$REPORT_ROOT" && sha256sum -c provenance/SHA256SUMS.txt)

      - name: Materialize exact snapshots
        shell: bash
        run: |
          set -euo pipefail
          CODE_ROOT=$(cat /tmp/code_root.txt)
          REPORT_ROOT=$(cat /tmp/report_root.txt)
          CODE_DST='code/snapshots/methodology_v5_2026-09-07'
          REPORT_DST='reports/technical_report_methodology_v2'
          rm -rf "$CODE_DST" "$REPORT_DST"
          mkdir -p "$CODE_DST" "$REPORT_DST"
          cp -a "$CODE_ROOT"/. "$CODE_DST"/
          cp -a "$REPORT_ROOT"/. "$REPORT_DST"/

      - name: Verify scientific identity privacy tests and PDF
        shell: bash
        run: |
          set -euo pipefail
          CODE_DST='code/snapshots/methodology_v5_2026-09-07'
          REPORT_DST='reports/technical_report_methodology_v2'

          test -f "$CODE_DST/src/visitas_analysis/study/pipeline.py"
          test -f "$CODE_DST/PYTHON_FUNCTION_INDEX.md"
          test -f "$CODE_DST/SOURCE_MANIFEST_SHA256.txt"
          test -f "$CODE_DST/.ai_handoff.md"
          test -f "$REPORT_DST/informe_cmat.tex"
          test -f "$REPORT_DST/informe_cmat.pdf"
          test -f "$REPORT_DST/referencias.bib"

          grep -q 'Complete static inventory (320 symbols)' "$CODE_DST/PYTHON_FUNCTION_INDEX.md"
          grep -q '03dd3d4ddd31cc2263be54900e1b25749fab8a7beb2033fbe796bf240fd4c39f' "$CODE_DST/.ai_handoff.md"
          grep -q 'scipy.stats.gaussian_kde' "$CODE_DST/.ai_handoff.md"
          grep -q '4,211' "$CODE_DST/.ai_handoff.md"
          echo '1e52d36809924df4bc84db65f6cb6669fe33d1f402076e8930b3a173f550595f  '"$REPORT_DST/informe_cmat.pdf" | sha256sum -c -

          if find "$CODE_DST" "$REPORT_DST" -type f \( -iname '*.xlsx' -o -iname '*.xls' -o -iname '*.parquet' -o -iname '*.feather' -o -iname '*.sav' -o -iname '*.dta' -o -iname '*.sas7bdat' \) | grep -q .; then
            echo 'ERROR: prohibited raw/binary microdata found in restored package' >&2
            exit 1
          fi

          python -m pip install --quiet pytest numpy pandas scipy statsmodels matplotlib pingouin scikit-learn openpyxl pypdf
          PYTHONPATH="$CODE_DST/src:$CODE_DST" python -m pytest -q "$CODE_DST/tests/test_study_helpers.py"
          python - <<'PY'
          from pypdf import PdfReader
          p = 'reports/technical_report_methodology_v2/informe_cmat.pdf'
          n = len(PdfReader(p).pages)
          print('PDF pages:', n)
          assert n == 40, n
          PY

      - name: Write restoration provenance
        shell: bash
        run: |
          set -euo pipefail
          CODE_ZIP='.restore_payload/CMAT_publication_study_v5_methodology_sanitized.zip'
          REPORT_ZIP='.restore_payload/CMAT_latex_report_v2_methodology.zip'
          CODE_CONTAINER_SHA=$(sha256sum "$CODE_ZIP" | cut -d' ' -f1)
          REPORT_CONTAINER_SHA=$(sha256sum "$REPORT_ZIP" | cut -d' ' -f1)
          mkdir -p docs/snapshots/methodology_v5_2026-09-07
          cat > docs/snapshots/methodology_v5_2026-09-07/README.md <<EOF
          # Methodology v5 / technical report v2 exact restoration

          Restored on 2026-09-08 from archives uploaded by the project owner.

          The uploaded ZIP containers had been repackaged. The code ZIP omitted the hidden file \`.ai_handoff.md\`; that single file was restored from the already-staged exact copy after verifying its SHA-256 against the embedded source manifest.

          Fidelity was verified at the file level before commit:

          - every entry in \`SOURCE_MANIFEST_SHA256.txt\` passed SHA-256 verification;
          - every entry in \`provenance/SHA256SUMS.txt\` passed SHA-256 verification;
          - \`informe_cmat.pdf\` matched SHA-256 \`1e52d36809924df4bc84db65f6cb6669fe33d1f402076e8930b3a173f550595f\` and has 40 pages;
          - the methodology test suite passed 9/9 tests;
          - \`PYTHON_FUNCTION_INDEX.md\` declares 320 symbols;
          - no Excel or other prohibited raw microdata formats were present.

          Uploaded container hashes at restoration:

          - code ZIP: \`$CODE_CONTAINER_SHA\`
          - report ZIP: \`$REPORT_CONTAINER_SHA\`

          Historical scientific-source fingerprint documented by the restored snapshot:

          \`03dd3d4ddd31cc2263be54900e1b25749fab8a7beb2033fbe796bf240fd4c39f\`

          Cohort interpretation remains unchanged: primary first-MU N=6,627; future-progressor sensitivity N=4,211. The refined longitudinal N=3,241 analysis is later work and is not claimed to be covered by this fingerprint.
          EOF

      - name: Commit exact restored package and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMAT research restoration bot'
          git config user.email 'actions@users.noreply.github.com'
          git lfs install --local

          git rm -rf .restore_payload
          git rm -f .github/workflows/restore-exact-methodology-v5.yml
          git rm -f .github/workflows/recover-methodology-v5-partial.yml 2>/dev/null || true
          git rm -f .github/workflows/finalize-methodology-v5-snapshot.yml 2>/dev/null || true

          git add -f code/snapshots/methodology_v5_2026-09-07
          git add -f reports/technical_report_methodology_v2
          git add docs/snapshots/methodology_v5_2026-09-07/README.md

          git status --short
          git commit -m 'restore: add exact methodology v5 snapshot and technical report v2'
          git push origin HEAD:restore/exact-methodology-v5-report-v2
