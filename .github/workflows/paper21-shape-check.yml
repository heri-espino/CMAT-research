name: Paper 2.1 shape validation

on:
  push:
    branches:
      - 'paper/paper2.1-visit-frequency'
    paths:
      - 'code/run_paper21_shape_check.py'
      - 'code/run_paper21_mixture.py'
      - 'cmat_analysis/**'
      - '.github/workflows/paper21-shape-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper21-shape-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  shape-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Paper 2.1
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cmat_analysis/pyproject.toml

      - name: Install shared CMAT library
        run: python -m pip install -e './cmat_analysis[dev]'

      - name: Compile shape runner
        run: python -m py_compile code/run_paper21_shape_check.py

      - name: Run direct skew-normal versus GMM validation
        run: |
          python code/run_paper21_shape_check.py \
            --materias data/controlled/Materias_pseudonymized.csv \
            --asesorias data/controlled/Asesorias_pseudonymized.csv \
            --shape-bootstrap 99 \
            --shape-cv-folds 5 \
            --shape-cv-repeats 5

      - name: Verify shape outputs
        shell: bash
        run: |
          for f in \
            results/paper21/tables/47_complete_case_skewnormal_vs_gmm.csv \
            results/paper21/tables/48_imputed_skewnormal_vs_gmm.csv \
            results/paper21/tables/49_complete_case_skewnormal_bootstrap_vs_gmm.csv \
            results/paper21/tables/50_complete_case_skewnormal_vs_gmm_cross_validation.csv \
            results/paper21/tables/51_imputed_skewnormal_bootstrap_vs_gmm.csv \
            results/paper21/tables/52_imputed_skewnormal_vs_gmm_cross_validation.csv; do
            test -s "$f"
          done

      - name: Upload shape-validation tables
        uses: actions/upload-artifact@v4
        with:
          name: paper21-shape-validation-\${{ github.sha }}
          path: |
            results/paper21/tables/47_complete_case_skewnormal_vs_gmm.csv
            results/paper21/tables/48_imputed_skewnormal_vs_gmm.csv
            results/paper21/tables/49_complete_case_skewnormal_bootstrap_vs_gmm.csv
            results/paper21/tables/50_complete_case_skewnormal_vs_gmm_cross_validation.csv
            results/paper21/tables/51_imputed_skewnormal_bootstrap_vs_gmm.csv
            results/paper21/tables/52_imputed_skewnormal_vs_gmm_cross_validation.csv
          if-no-files-found: error
          retention-days: 30
