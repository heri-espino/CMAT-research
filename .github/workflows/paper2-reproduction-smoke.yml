name: Paper 2 source and synthetic contract

# Run automatically once on the first workflow addition. Subsequent checks
# are manual to avoid rebuilding at every commit.
on:
  push:
    branches:
      - paper/paper2-beyond-first-attendance
    paths:
      - .github/workflows/paper2-reproduction-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install shared scientific library
        run: python -m pip install -e './cmat_analysis[dev]'
      - name: Compile all namespaced Python sources
        run: python -m compileall -q papers/paper2-beyond-first-attendance
      - name: Check all supported analysis contracts (no institution data)
        run: python papers/paper2-beyond-first-attendance/run_all.py --check
      - name: Run PPA and shared-estimator synthetic tests
        run: |
          python -m pytest -q \
            papers/paper2-beyond-first-attendance/analysis/ppa-groups/test_ppa_groups.py \
            papers/paper2-beyond-first-attendance/analysis/ppa-groups/test_synthetic_models.py
