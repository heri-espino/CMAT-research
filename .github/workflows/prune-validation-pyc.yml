name: Prune validation-only Python bytecode

on:
  push:
    branches:
      - restore/exact-methodology-v5-report-v2
    paths:
      - '.github/workflows/prune-validation-pyc.yml'

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Remove bytecode generated only by restoration validation
        shell: bash
        run: |
          set -euo pipefail
          CODE='code/snapshots/methodology_v5_2026-09-07'
          REPORT='reports/technical_report_methodology_v2'
          find "$CODE" -type f -name '*cpython-312*.pyc' -delete
          # Exact historical files, including manifest-listed cpython-313 bytecode, remain.
          (cd "$CODE" && sha256sum -c SOURCE_MANIFEST_SHA256.txt >/dev/null)
          (cd "$REPORT" && sha256sum -c provenance/SHA256SUMS.txt >/dev/null)
          test -z "$(find "$CODE" -type f -name '*cpython-312*.pyc' -print -quit)"

      - name: Commit validation cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CMAT research restoration bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/prune-validation-pyc.yml
          git add -A code/snapshots/methodology_v5_2026-09-07
          git commit -m 'chore: remove validation-only Python bytecode'
          git push origin HEAD:restore/exact-methodology-v5-report-v2
