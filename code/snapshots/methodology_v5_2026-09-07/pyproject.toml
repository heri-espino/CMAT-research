[project]
name = "visitas-analysis"
version = "0.1.0"
description = "Analisis de visitas al CMAT."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "statsmodels==0.14.6",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
